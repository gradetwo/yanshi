[package]
name = "yanshi-http"
description = "偃师 Yanshi 零依赖 HTTP/1.1 与 WebSocket 传输层"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "yanshi-serve"
path = "src/main.rs"

# **★ GPU 后端：**可选依赖 ＋ feature 门控** ✗ ★**（第 261 轮 ✓；**目标第 6／7 条 ＋ AGENTS.md 第 5 条 ✓）。
#
# **∴ 为什么门控 ✗**：**实测**（**第 260 轮 ✓）**✗**：
#   **∴ `cargo add wgpu` ⇒ 包数 **89 → 187**（**+98，**+110% ✓）** ✓
#     ＋ **∴ 新增里含**平台特定包**✗（`android_system_properties`／`core-foundation`／
#       `core-graphics-types`／`ash`／`naga` 系 ✓）
#       ⇒ **∴ 审计面**扩大一倍** ✓**** ✓✓
#   **∴ 而**收益**目前只有**内核侧**的实测**✗（**量化 **时间 −95.9%／主线程 −98.7% ✓）
#     ⇒ **∴ 服务端**收益**未知** ✓（**∴ 而且**服务端**没有那 16 MB 上传**
#       ⇒ **∴ 它的收益**可能更小** ✓）**** ✓✓
#   **⇒ ★ 所以 ✗ ★**：**默认**不开**✗
#     ⇒ **∴ 于是**：**依赖树**仍是 89** ✓ ⇒ **∴ 而**要测／要用时**才开 `--features gpu`** ✓ ★**** ✓✓
#
# **∴ 反面（**照实说 ✓）★**：**开了之后**构建要装 98 个新包** ✓
#   ⇒ **∴ 所以**：**CI 里**单独测它**✗（**体积／构建时间 ✓，**目标第 10 条 ✓）
[features]
default = []
# **∴ `gpu` ✗**：**打开后**才有 `wgpu`** ✓ ⇒ **∴ 默认**依赖树不变** ✓
# **★ `gpu` 现在也带上**独立 crate `yanshi-gpu`** ✗ ★**（第 301 轮 ✓）：
#   **∴ 为什么 ✗**：**第 300 轮**把 GPU 层单独成 crate**✗ ⇒ **∴ 于是**这里**委托它**✗
#     ⇒ **∴ 不再**在本 crate 里**重复一份 WGSL 与实现** ✓**** ✓✓
# **★★★ 必须**同时打开 `yanshi-render/gpu` ✗ ★★★**（**第 448 轮 ✓；**实测根因 ✓）：
#   **∴ 症状 ✗**：**带 `--features gpu` 构建服务端**✗
#     ＋ **∴ 拿得到**真实适配器**✗（**`adapter:Gl:IntegratedGpu:Mesa Intel(R) HD Graphics 5000` ✓）
#       ＋ **∴ 自检**逐位一致**（**`max_channel_delta ＝ 0` ✓）
#         ⇒ **★ 而** `render_backend` **永远**是 `cpu`**✗
#           ＋ **∴ 且** GPU 相关日志**零命中** ✓ ★**** ✓✓
#   **∴ 根因 ✗**：**`try_quantize_on_gpu` **整段**被
#     **`#[cfg(feature = "gpu")]` **拿掉****✗（**`yanshi-render/src/buffer.rs:432` ✓）
#     ⇒ **∴ 因为** `yanshi-http` 的 `gpu` **只**加了 `dep:wgpu` ＋ `dep:yanshi-gpu`**✗
#       ⇒ **∴ 而** `yanshi-render` **自己的 `gpu` feature **始终为假**** ✓
#         ⇒ **∴ 于是**：**渲染路**连**试 GPU 的代码**都**没编进去** ✓
#           ⇒ **∴ 所以**：**它**只留下**先悲观记 `Cpu`** 那句** ✓ ★**** ✓✓
#   **∴ 为什么自检**还能用 GPU ✗**：**它**直接调 `yanshi_gpu::Quantizer`**✗
#     （**`crates/yanshi-http/src/gpu_policy.rs` ✓）⇒ **∴ 不经过**那条 `cfg`** ✓
#       ⇒ **★ 所以**：**两条路**一开一关** ✓ ⇒ **∴ 那**正是**读数矛盾**的来源** ✓ ★**** ✓✓
#   **∴ 修法 ✗**：**本 feature **也**打开 `yanshi-render/gpu`** ✓
#     ⇒ **∴ 于是**：**渲染路**真正**试 GPU**✗ ⇒ **∴ `render_backend` **才会**如实** ✓ ★**** ✓✓
#   **∴ 代价 ✗**：**开 `gpu` 时** `yanshi-render` **也**编入 GPU 路** ✓
#     （**∴ 那**正是**本 feature 的意图** ✓；**∴ 默认关 ⇒ **依赖树**不变 ✓）★**** ✓✓
gpu = ["dep:wgpu", "dep:yanshi-gpu", "yanshi-render/gpu", "dep:libc"]

[dependencies]
yanshi-core = { path = "../yanshi-core", version = "0.1.0" }
yanshi-render = { path = "../yanshi-render", version = "0.1.0" }
yanshi-server = { path = "../yanshi-server", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
# **∴ 可选：**只有 `--features gpu` 时才进依赖树** ✓（**第 261 轮 ✓）
wgpu = { version = "26.0.1", optional = true }
# **★ 可选：**GPU 加速层** ✗ ★**（**∴ 只在 `--features gpu` 时进依赖树 ✓）
#   **∴ 而** `yanshi-wasm` **不**依赖它** ✗ ⇒ **∴ 判据** `tool-wasm-tree-no-wgpu.mjs` **守住它** ✓
yanshi-gpu = { path = "../yanshi-gpu", optional = true }
# **∴ 微基准的 CPU 时间口径** ✓（`gpu_quantize_bench` 用 `getrusage` ✓，macOS/Linux 通用 ✓）
libc = { version = "0.2", optional = true }

# **★ 微基准只在 gpu 特性下有 main ✗ ★**（**第 497 轮实测 ✓）
#   **∴ 为什么必须声明 ✗**：**那个文件头是 `#![cfg(feature = "gpu")]`**✗
#     ⇒ **∴ 无 gpu 时 ⇒ **整个 crate 是空的 ⇒ **没有 `main`**** ✓
#       ⇒ **∴ `cargo test --workspace`（**不带 feature ✓）报
#         `E0601: main function not found`** ✓
#         ⇒ **∴ 而** `clippy --features gpu` **抓不到** ✓（**∴ 那条路**有 main ✓）★**** ✓✓
#   **∴ 现在 ✗**：**声明 `required-features`**✗
#     ⇒ **∴ 无 gpu 时**根本不编译它** ✓ ＋ **∴ 有 gpu 时**照常 ✓ ★**** ✓✓
[[bin]]
name = "gpu_quantize_bench"
path = "src/bin/gpu_quantize_bench.rs"
required-features = ["gpu"]
