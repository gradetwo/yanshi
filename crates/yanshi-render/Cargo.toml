[package]
name = "yanshi-render"
description = "偃师 Yanshi 渲染计算内核层（D0 CPU 基线）与 CPU 合成后端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# **笔刷引擎**（第 241 轮）：为"两端同源"做准备 —— 喂底图的那段 tile 循环
# 现在有**两份**（服务端 tools.rs 与内核 brush.rs）⇒ 本项目记过的头号病 ✓。
# 收拢到 yanshi-render 需要它依赖 hokusai。
# **收益**：一处真相；两端喂底图语义必然一致。
# **代价**：yanshi-render 多一个依赖。但 yanshi-wasm 与 yanshi-server 都已依赖它
#（同一个 0.3，同一个 lock）⇒ **零新增包** ✓；且它已在 wasm32 上可用 ✓。
hokusai = "0.3"
yanshi-core = { path = "../yanshi-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
libm.workspace = true
# **deflate**：`flate2` + `zlib-rs`（纯 Rust ✓，wasm32 可用 ✓）——
# 它**本来就在依赖树里** ✓（`zip` 带进来的 ✓）⇒ 本轮**零新增包** ✓（代价与收益见 `png.rs` 文件头 ✓）。
flate2.workspace = true
yanshi-gpu = { version = "0.1.0", path = "../yanshi-gpu", optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
gpu = ["dep:yanshi-gpu"]
# **∴ `cargo add --optional` **自动生成的那条**与 `gpu` 重复**✗ ⇒ **∴ 删掉它** ✓
