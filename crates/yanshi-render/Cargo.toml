[package]
name = "yanshi-render"
description = "偃师 Yanshi 渲染计算内核层（D0 CPU 基线）与 CPU 合成后端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# **★ PSD 图层树 ✗ ★**（**第 253 轮 ✓）：**只有图层级那条路走它**
#   ⇒ **∴ 压平的读写仍用本仓自己的 `psd.rs`**（**已有测试 ✓ 不重复造 ✓）★
ag-psd.workspace = true
# **笔刷引擎**（第 241 轮）：为"两端同源"做准备 —— 喂底图的那段 tile 循环
# 现在有**两份**（服务端 tools.rs 与内核 brush.rs）⇒ 本项目记过的头号病 ✓。
# 收拢到 yanshi-render 需要它依赖 hokusai。
# **收益**：一处真相；两端喂底图语义必然一致。
# **代价**：yanshi-render 多一个依赖。但 yanshi-wasm 与 yanshi-server 都已依赖它
#（同一个 0.3，同一个 lock）⇒ **零新增包** ✓；且它已在 wasm32 上可用 ✓。
hokusai = "0.3"
yanshi-core = { path = "../yanshi-core", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
libm.workspace = true
# **deflate**：`flate2` + `zlib-rs`（纯 Rust ✓，wasm32 可用 ✓）——
# 它**本来就在依赖树里** ✓（`zip` 带进来的 ✓）⇒ 本轮**零新增包** ✓（代价与收益见 `png.rs` 文件头 ✓）。
flate2.workspace = true
yanshi-gpu = { version = "0.2.0", path = "../yanshi-gpu", optional = true }

# **P2 #16 颜料混色（Clean-Room）**：MIT 的 `neco-pigment`（光谱 K/S 混合）。
# **代价已核**：`.crate` 压缩 19,972 字节、源码 1505 行、传递依赖 +1（`neco-color`）、
# MSRV 1.82（本机 1.99）、源码无 unsafe/rand/时间 => 纯函数确定性。
# **风险如实记**：供应链年轻（单作者、单版本、下载 27 次）；**采纳后对 wasm 的体积增量本机量不了**
# （本机没装 wasm32 target）=> 由 CI 的 wasm job 覆盖构建，体积增量待测。
neco-pigment = "0.1"
# **JPEG 解码**（纯 Rust 的 `jpeg-decoder`）——**本仓第一个为图像格式新增的外部依赖** ✗（零依赖口径的例外 ✓）。
# **代价已核**：`.crate` 压缩 ~110KB、纯 Rust 无 unsafe 网络/时间依赖 ✓；传递依赖见 Cargo.lock
#（jpeg-decoder 的并行解码路径会带入 rayon 一系——与"传递依赖 0"的旧说法不符，以 lock 文件为准 ✓）。
# **为什么破例**：JPEG 是照片的默认格式，手写 DCT/Huffman 解码器不在本仓自研范围内 ✓（与 PSD 走 ag-psd 同理 ✓）。
# **风险如实记**：解码器由第三方维护；坏文件/CMYK 走显式失败路，不静默 ✓。
jpeg-decoder = "0.3"
[dev-dependencies]
proptest.workspace = true

[features]
gpu = ["dep:yanshi-gpu"]
# **∴ `cargo add --optional` **自动生成的那条**与 `gpu` 重复**✗ ⇒ **∴ 删掉它** ✓
