[package]
name = "yanshi-wasm"
description = "偃师 Yanshi 计算内核的 WASM 绑定（浏览器端本地乐观渲染）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yanshi-core = { path = "../yanshi-core", version = "0.1.0" }
yanshi-render = { path = "../yanshi-render", version = "0.1.0" }
hokusai = "0.3"
# **两端同源的数学** ✓（第 821 轮 ✓）：这一层里也曾有 `.ln(` 与 `.powi(2)` ✗
# ⇒ 它们与服务端的 glibc 结果差最后一位 ⇒ **浏览器算出的笔触与服务端不同** ✗。
libm.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
