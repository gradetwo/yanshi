[package]
name = "yanshi-server"
description = "偃师 Yanshi 无头服务端：文档服务、Job 协议、capability token、广播与工具层"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
libm.workspace = true
yanshi-medium-host = { path = "../yanshi-medium-host" }
yanshi-core = { path = "../yanshi-core", version = "0.3.0" }
yanshi-heap = { path = "../yanshi-heap", version = "0.3.0" }
yanshi-render = { path = "../yanshi-render", version = "0.3.0" }
serde.workspace = true
serde_json.workspace = true
# **令牌表的键用摘要**（审计 M-2）：`sha2` 已是工作区既有依赖（`yanshi-core` 在用 ✓）
# ⇒ 不新增供应链面 ✓；只把「按令牌原文查表」换成「按 SHA-256 查表」✓。
sha2.workspace = true
hokusai = "0.3"
# **★ 服务端真字体（字体方案 Phase 3）★**：`fontdb` 枚举系统字体（**它在 Linux 用 fontconfig、
# macOS 用 Core Text、Windows 用 DirectWrite** ⇒ 正是方案点名的那三样，**已经打包好了** ✓），
# `ab_glyph` 把字形光栅化成覆盖度（**成熟、纯 Rust、MIT** ✓）。
#
# **∴ 两面（**按 AGENTS.md 的清单 ✓）**：
#   ＋ **收益**：**MCP／无头侧**终于能用**系统与预置字体**画字**（**现状：只有一套 16×16 位图 ✓）
#   ＋ **体积**：**只加在 `yanshi-server`** ✗ **不进 `yanshi-render`／`yanshi-wasm`** ✓
#     ⇒ **∴ 内核与 wasm 包**一个字节都不涨** ✓（**∴ 用 wasm 冒烟与产物核对 ✓）★★
#   ＋ **确定性**：**方案已明确**放弃"字体渲染跨端一致"** ✓ ⇒ **∴ `builtin` 仍是**默认**✗
#     老文档的像素**零变更** ✓（**∴ 真字体只在你点名时才走 ✓）★★
#   ＋ **平台**：**桌面可用**✗ **wasm 不参与**（**服务端才栅格化 ✓）★
#   ＋ **供应链**：**两个都广泛使用**（`fontdb` 是 resvg 的字体后端 ✓ MIT ✓）★
#   ＋ **构建时间**：**实测首次编译见提交信息 ✓（**∴ 不如实报就不写 ✓）★
fontdb = { version = "0.24", default-features = false, features = ["fs"] }
ab_glyph = "0.2"
# **★ 真字体子集化（draw_text 出真 `<text>`，设计文档 `yanshi-fix-research/draw-text-DESIGN.md` §2.1）★**：
# `allsorts` 把文本用到的字形切成 TTF 子集（draw 时生成、随文档存 blob、导出内联 @font-face ✓）。
# 只开 `flate2_rust`（纯 Rust 的 flate2 后端 ✓）⇒ 不引 `flate2_zlib` 的 C 库（`libz-sys` ✓）。
#
# **∴ 两面（**按 AGENTS.md 的清单 ✓）**：
#   ＋ **收益**：纯 Rust、确定性（同一文本两次子集逐字节相同 ✓）、`Minimal` profile 含 OS/2
#     ⇒ Chromium OTS 通过 ✓；CFF 字体也保留 cmap（`@font-face` 必须 ✓）。
#   ＋ **代价**：约 20 个传递 crate；GPOS/GSUB 被丢掉 ⇒ 字距（kern）丢失
#     （"Congrats!" 80pt 上 `r→a` −1.6px，CJK 不受影响 ✓）；产出是 TTF 子集不是 WOFF2
#     （体积仍远小于 512KB 上限 ✓）；CJK 子集 ~38KB。
#   ＋ **确定性**：同一输入 ⇒ 同一子集字节（两次 sha256 相同，2026-10-27 实测 ✓）。
#   ＋ **平台**：纯 Rust，只加在 `yanshi-server` ⇒ 不进 `yanshi-render`／`yanshi-wasm` ✓。
#   ＋ **供应链**：`allsorts` 0.17（2026-05，Apache-2.0（crates.io 元数据；2026-10-27 核），Prince 自 2019 年生产使用 ✓）；
#     备选 `subsetter`（Typst 血统）对照实测过：CFF 子集缺 cmap ⇒ `@font-face` 不可用 ✗，
#     故不用；`hb-subset` 需 C++ 构建 ✗、`write-fonts` 不是子集器 ✗，均不进实测。
#   ＋ **构建时间**：首次编译见提交信息（不如实报就不写 ✓）。
# **∴ 注意**：**`Pdf` profile 缺 OS/2 ⇒ Chromium OTS 拒绝** ✗（2026-10-27 实测 ✓）⇒
#   **实现必须用 `Minimal`**（见 `fonts::subset_layout` ✓）。
allsorts = { version = "0.17", default-features = false, features = ["flate2_rust"] }
# **诊断包的 zip 容器** —— 取舍见 `src/diagnostics.rs` 头部：
# 只开 `deflate-flate2-zlib-rs`（纯 Rust 的 zlib-rs 后端 ✓）⇒ **不引** zopfli / bzip2 /
# zstd / lzma / aes 那一整套默认特性（默认特性会把它们与七八种压缩后端全拉进来）。
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# **预览渲染的 JPEG 编码器**（期 4 D2-1）：本仓此前只有 JPEG 解码
# （`jpeg-decoder` 在 render 侧）、无编码器；`preview_preset` 的默认
# 渲染格式是 jpeg（base64 体积约为 PNG 的十分之一，工具响应不宜
# 塞大图），故需一个编码器。
# **∴ 两面（**按 AGENTS.md 的清单 ✓）**：
#   ＋ **收益**：512px 代理图的 base64 从约 1MB（PNG）降到约 80KB（JPEG）。
#   ＋ **代价**：零新增 crate——`image` 0.25 已在 lock 里（经 rawler 间接
#     引入），其 JPEG 编码器是 crate 内实现；此处只开 `jpeg` 特性，
#     lock 实测只多一行（yanshi-server → image 边）；只加在
#     `yanshi-server`，不进 `yanshi-render`／`yanshi-wasm`。
#   ＋ **确定性**：同一输入 ⇒ 同一 JPEG 字节（固定质量 85、无元数据）。
#   ＋ **平台**：纯 Rust，服务端 native；wasm 不参与。
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# **URL 拉取的 HTTP 客户端**（设计文档第 4 章：`put_blob` 的 `path` 增加 http(s) 形态）。
# 选 `ureq` 3 + rustls/ring：同步 API、无 async 运行时（**不引 tokio 级依赖** ✓）。
#
# **∴ 两面（按 AGENTS.md 的清单）**：
#   ＋ **收益**：成熟稳定（3.x）、阻塞式小 API 与工具层同步风格一致；rustls 纯 Rust、
#     供应链可审计；ring 是 rustls 的缺省级密码后端，无需 aws-lc 的 C 工具链。
#   ＋ **体积**：只加在 `yanshi-server` ⇒ 不进 `yanshi-render`/`yanshi-wasm`，
#     浏览器内核一字节不涨；服务端多约十个传递依赖（rustls/ring/webpki-roots/
#     ureq-proto/http 等），二进制相应变大（量级以构建产物为准）。
#   － **代价**：ring 带一个 C 编译步（cc）；`default-features = false` 关掉
#     gzip/charset/cookies/json（都用不上），只留 `rustls` 特性收窄攻击面。
ureq = { version = "3", default-features = false, features = ["rustls"] }
# **★ RAW 展开 crate（可选）★**（RAW 第二包）：导入计划／元数据组装的语义
# 归 `yanshi-raw`（设计 9.3），工具层只透传与落账 ⇒ 由 `raw` feature 门控，
# 与 `yanshi-render/raw` 同开同关（见下 [features]）；默认关 ⇒ 不进依赖树。
yanshi-raw = { path = "../yanshi-raw", version = "0.3.0", optional = true }

[features]
# **★ `raw`：**委托** `yanshi-render/raw` ✗ ★**（RAW 设计 v3 第 9 章定版）：
#   **∴ 必须**与 `yanshi-render` **同开同关** ✗ —— **∴ 所以**写成**委托** ✗
#     ⇒ **∴ 开**本 feature **即**同时开**渲染层那份** ✓ ⇒ **∴ 不存在**「**只开一侧**」的**中间态** ✗
#       （**第 448 轮 `gpu` 的教训**：**http 开了、render 没开** ⇒ **∴ 渲染路**被 `cfg` **静默拿掉** ✗）。
#   **∴ 默认关** ⇒ **∴ 依赖树与工具面**逐位不变** ✓（**RAW **不新增工具** ✗，
#     **只**给既有 `import_image` **加参数** ✓）。
#   **第二包补**：工具层要组装导入计划（record 落账／raw_meta 回显），其语义
#   本人在 `yanshi-raw` ⇒ 本 feature 同时点亮 `dep:yanshi-raw`（仍是同一条
#   委托链：server/raw ⇒ render/raw ∧ dep:yanshi-raw，三处同开同关 ✓）。
raw = ["yanshi-render/raw", "dep:yanshi-raw"]

[dev-dependencies]
proptest.workspace = true
yanshi-wasm = { path = "../yanshi-wasm" }
yanshi-raw = { path = "../yanshi-raw", features = ["test-support"] }
