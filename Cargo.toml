[workspace]
resolver = "2"
members = [
    "crates/yanshi-core",
    "crates/yanshi-render",
    "crates/yanshi-server",
    "crates/yanshi-mcp",
    "crates/yanshi-gpu",
    "crates/yanshi-http",
    "crates/yanshi-wasm",
    "crates/yanshi-medium-example",
    "crates/yanshi-medium-host",
    "crates/yanshi-medium-oil",
    "crates/yanshi-medium-watercolor",
    "crates/yanshi-medium-marker",
    "crates/yanshi-medium-pencil",
    "crates/yanshi-medium-pixel",
    # **★ timelapse ✗**：**绘画过程视频导出 CLI**（**合入自 /tmp 的交付包 ✓）★
    "crates/yanshi-raw",
    "crates/yanshi-timelapse",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["The Yanshi Authors <yanshi@wangda.today>"]
description = "偃师 Yanshi — AI-native collaborative painting and design engine"
repository = "https://github.com/gradetwo/yanshi"
keywords = ["painting", "graphics", "ai", "collaboration", "crdt"]
categories = ["graphics", "multimedia"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
proptest = "1.6"
# **两端同源的数学** ✓（第 806 轮）：`std` 的 `sin/cos/exp/powf` 在 native（glibc ✓）
# 与 wasm32（Rust 自带 ✓）上差最后一位 ✗ ⇒ 实测两个模式对约一半笔刷给出**不同画面** ✗。
# `libm` 是纯 Rust ✓ ⇒ **同一份源码编两次** ⇒ 结果逐位相同 ✓（`sqrt` 仍用 std ✓：IEEE 要求它正确舍入 ✓）。
libm = "0.2"
# **`flate2` 已经在树里** ✓（`zip` 把它带进来了 ✓，见 `Cargo.lock` ✓）⇒ 把它暴露给
# `yanshi-render` **不新增任何包/版本** ✓。**必须**照抄 `zip` 的 feature 写法 ✓
#（`default-features = false` + `zlib-rs` ✓）：flate2 的默认后端是 `miniz_oxide` ✗ ⇒
# 一旦打开默认 feature，锁文件里就会多出 `miniz_oxide`（正是要避免的 ✓）。
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# **★ PSD 图层树：读 ＋ 写 ✗ ★**（**第 253 轮 ✓；**用户建议里点名的 `ag-psd` ✓）
#
# **∴ 两面（**按 AGENTS.md 的清单 ✓）✗**：
#   ＋ **收益**：**图层树的**读与写一次到位**✗（**图层记录／通道数据／RLE／
#     `luni`（Unicode 名 ✓）／`lsct`（**组的分节符 ✓）／engine data ✗
#     ⇒ **∴ 手写是**一两周量级**✗ 而**本仓已有 400 行的 `psd.rs` 只做**压平图** ✓）★
#   ＋ **体积／依赖 ✗**：**它只依赖 `flate2 ^1`**✗ 而**本仓**已经**因为这个原因
#     把它显式钉成 `zlib-rs` 后端**（见上面那段注释 ✓）⇒ **∴ 代价**很小** ✓
#   ＋ **平台 ✗**：**纯 Rust ✓ ⇒ **wasm32 可用**（**与 `zlib-rs` 同一条路 ✓）★
#   ＋ **风险（**如实 ✓）✗**：**它**自称 "**vibe-coded port**"**✗
#     文档覆盖 **43%** ✗ 且**列了 known limitations** ✓
#     ⇒ **∴ 所以**：**必须先拿**真文件**验**（**本机有 ImageMagick ✓
#       ＋ 判据用**PSD 自带的压平合成图**当答案键 ✓）✗ 不合格就退回扩自己的 ✓ ★★
#   ＋ **确定性 ✗**：**我们只依赖它的**读**✗ 与写的**往返** ✓ ⇒ 由判据把关 ✓ ★
ag-psd = { version = "0.3", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
# **不要在这里设 `panic = "abort"`** ✗（本行曾是它 ✓，本轮移除 ✓）。
#
# **代价是什么** ✓：`panic = "abort"` 是**整 workspace** 的 ✓ ⇒ 它让 release 下的测试目标
# （要 `unwind` ✓）与按 `abort` 编的介质插件**策略冲突** ✗ ⇒ `cargo test --release -- --ignored`
# **直接编不过** ✗ —— 而那是本项目"长任务全绿"的唯一闸门 ✓（Actions 已按用户要求改成手动 ✓）。
# 也就是说：为了**一点 wasm 体积** ✓ 换来"**发布档根本跑不了测试**" ✗，得不偿失 ✓。
# **而且**：服务端用 `unwind` **更合适** ✓ —— 一个线程 panic 不会带崩整个进程 ✓。
# 若将来确实要为 wasm 体积恢复 abort ✓，应当**只对 wasm 目标**生效 ✓（例如改用
# 目标专属构建配置或单独的 workspace ✓），**不要再挂回这个全局 profile** ✗。

[profile.bench]
lto = "thin"

# 本地修复版 hokusai-core：change_color_* 改为 per-dab 随机漂移（均值 0），
# 修复原版每 dab 加固定值导致的系统性色相/明度偏移。见 ~/workspace/hokusai-core-fixed/
[patch.crates-io]
hokusai-core = { path = "vendor/hokusai-core" }
