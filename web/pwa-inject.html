<!-- **★ PWA 本地接管注入片段 ✓ ★**（第 638 轮 ✓；**部署矩阵 §14.21 ✓**）
     **∴ 为什么需要它 ✗**：**导出的页面是**服务端的**✗**（**它引用 `/api/*` ✓**）⇒
     **∴ 无服务器部署里那些请求必须由**本地层**接管 ✗** ⇒ **∴ 本片段就是那一步 ✓**。
     **∴ 它**固定不变 ✗** ⇒ **∴ 判据可以断言"**除本片段外**与导出结果逐字节相同 ✓**"。 -->
<script type="module">
  // **∴ ① 装本地 API 层 ✗**（**覆写 `window.fetch` ⇒ `/api/*` 与 `/health` 走本地 ✓**）
  try {
    const { installLocalApi, makeLocalApi } = await import("/api-local.js");
    const { open } = await import("/store.js");
    installLocalApi({ local: await makeLocalApi(await open()) });
    window.__pwaInstalled = true;
    console.log("PWA 本地 API 已安装 ✓");
  } catch (err) {
    // **∴ 装不上必须**说出来 ✗**（**否则表现为"服务端坏了"✗**）。
    window.__pwaInstallError = String((err && err.stack) || err);
    console.error("PWA 本地 API 安装失败 ✗", err);
  }
  // **∴ ② 注册 service worker ✗**（**离线可用 ✓**）
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
