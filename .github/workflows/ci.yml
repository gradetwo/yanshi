# 快速反馈：push / PR 上跑「几分钟内能出结果」的检查。
#
# 分工原则（本轮调整）：
#   * 本文件 = 格式化、lint、单元/集成测试、wasm 冒烟 —— 目标 < 10 分钟；
#   * `heavy.yml` = 耗时长 / 吃 CPU / 吃内存的长任务（10 万原子 fuzz、性能预算、4K 剖面、
#     内核原生计时），改为**每夜定时 + 手动触发**，不再阻塞每次 push。
# **★ 只改 CI/CD 配置的提交：run 只要能启动就可以停掉（用户指示 2026-10-15 ✓）★**
#
# **规则** ✓：提交**只动 `.github/**`**（workflow 配置 ✓）时，它触发的 run **只需证明"能跑起来"** ✓
# —— YAML 合法 ✓ ＋ GitHub 接受并**排队/启动**了这次 run ✓（配置不合法时 GitHub 会立刻判失败 ✓）
# ⇒ 之后**可以直接取消** ✓，不必等它跑完 ✗（那要占几十分钟 runner ✓，而**产品代码一行没变** ✓）。
#
# **什么时候绝不能停** ✗：
#   * **tag 发布**（`release.yml` 的 `push: tags` ✓）⇒ 它要**真的出包 ＋ 建 Release ＋ 传资产** ✓
#     ⇒ 停了就没有发布 ✓；
#   * **含产品代码的提交**（`crates/**`、`scripts/**`、`web/**` …）⇒ 那些 run 的结果才是"代码通过判据"的凭据 ✓；
#   * 想留档的那一次（例如 **tag 指向的那个提交** ✓）⇒ 它的 CI 结果是"发布出去的树通过判据"的证据 ✓。
#
# **本仓库的实测账** ✓（2026-10-15，用户指出"跑得有点重复"之后 ✓）：
#   最近 40 次运行里 `CI|push` 有 **28 次** ✓、`Release|workflow_dispatch` 有 **8 次**（**6 次被取消** ✗）
#   ⇒ 后者的平台构建被**起了 ~24 个、扔掉 ~18 个** ✗ ⇒ 所以这一条要写成规矩 ✓。

name: CI

# **触发** ✓（用户指示更新 ✓）：`main` 上 push 与 PR 都跑 ✓，也保留手动触发 ✓。
#
# 为什么改了 ✓：现在的分工是「**重活全部交给 GitHub，本地只做小改动** ✓」——
# 本地不再跑全量 `cargo test` / 浏览器判据 / wasm 构建 ✓，改为 push 后**异步查看**结果 ✓
# （`gh run list`、`gh run view` ✓）。长任务仍在 `heavy.yml` 里手动/定时跑 ✓。
on:
  # **开源项目：CI 免费且不限额度** ✓ ⇒ 所有分支都跑 ✓（分支多、并行多，正是该用的地方 ✓）。
  push:
    # **纯文档提交不触发** ✓（第 398 轮 ✓）：实测本仓库多次"排队积压"里，
    # **大多数是我自己的 `docs:` 提交** ✗ —— 它们**不改变任何被判条件** ✓，
    # 却会占住并发位 ✓ ⇒ **让我最新那一轮永远排不到** ✗（这个拥堵我犯过 5 次 ✓）。
    # ⇒ 从**源头**掐掉：**只改文档的推送不跑流水线** ✓。
    # **注意**：`pull_request` 与 `workflow_dispatch` **保持全量** ✓ ——
    # 所以"需要时就手工跑一次"这条路仍在 ✓（用户要求"手工跑和自动触发都要用" ✓）。
    # **★ 只跑分支推送，不再为 tag 推送重复跑一遍（2026-10-15，用户指出"跑得有点重复"后改 ✓）★**
    # **实测账** ✓：推 `v0.2.1` 时，**同一个提交 `1e95216` 上同时跑着 3 个 `CI` run** ✗
    #（合并推送 1 个 ＋ tag 推送又触发 1 个 ＋ …）⇒ 每个 run 都是 **6 个判据分片** ✗。
    # **为什么 tag 不必再跑** ✓：tag 指向的提交**必然已经在分支上跑过 CI** ✓
    #（tag 就是"给已验证的提交贴标签" ✓）⇒ 重复跑**不增加任何保证** ✗，只占 runner ✓。
    # **★ 不再为 `l4-sync` 起 run（2026-10-15 实测修 ✓）★**
    #
    # **为什么** ✗：交接约定是"每笔推 `l4-sync`" ✓，而我习惯一条命令推两个 refspec
    #   （`git push origin main main:l4-sync` ✓）⇒ **GitHub 为两个分支各起一次 CI** ✗。
    #   实测账（提交 `88a748ff` ✓）：
    #   ```
    #   38738870461  88a748f  12:58:54  failure   ← l4-sync 那次
    #   38738871973  88a748f  12:58:55  success   ← main 那次
    #   ```
    #   ⇒ **同一棵树、同一秒、跑两遍** ✗；两次结论还**不一致** ✗（一片判据抖动）
    #   ⇒ 这正是用户指出过的"**跑得有点重复**"，根因是**推送习惯 ＋ 这里没排除镜像分支**。
    #
    # **为什么排除是安全的** ✓：`l4-sync` **恒等于 `main`**（每笔都快进到同一提交）
    #   ⇒ **同一棵树** ⇒ `main` 的 CI 结果**就是**它的结果，重复跑**没有信息量**。
    #
    # **注意**：`branches-ignore` **不能**与 `branches` 同时写（二者互斥）；
    #   只写 `branches-ignore` 的语义是"**除它以外的所有分支**" —— 正是要的。
    #   另外这样写**tag 推送依然不会**触发本 workflow（`branches*` 只管分支）。
    branches-ignore: ['l4-sync']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'scripts/criteria-known-red.txt'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# **同一分支只保留最新一轮 CI** ✓（第 883 轮 ✓）：本仓判据整套跑一次很久（6 个 shard ＋
# wasm/browser 作业 ✓）⇒ 而**每次 push 都会起一轮** ✗ ⇒ 高频推送会让队列**严重拥堵** ✗
#（本会话实测：约 20 次推送 ⇒ 约 20 轮排队 ✓，要等很久才看到结论 ✗）。
# ⇒ ⇒ 用 GitHub **原生**的 `concurrency` ✓：新推送**自动取消**同一分支上被取代的轮 ✓ ✓ ——
#    ⇒ **永远只等最新一轮** ✓、**不再需要人工取消** ✗（人工取消踩过一次坑 ✓：
#      我取消的恰是**承载 `enter` 修法**的那一轮 ✗ —— 第 869 轮的教训 ✓）。
# **★★★ 用户裁定（**2026-10-12 ✓）✗ ★★★**：**取消**不必要** ✗
#   **∴ 原设置 ✗**：`cancel-in-progress: **true**` ——
#     **∴ 它的理由（**上面那段 ✓）是**「**最新提交覆盖此前所有修法」** ✓ ★
#       ＋ **∴ 但**实测代价更大 ✗ ★**：
#         **∴ ① 我连续多轮**拿不到"完成"的结论** ✗**（**∴ 本文件第 240 行早就记着这条 ✓）
#           ＋ **∴ ② 而**且**：**被取消的那一轮**往往**已经跑完大半**✗（**∴ 白烧额度 ✓）
#             ＋ **∴ ③ 而**队列本来**不会溢出**✗ ⇒ **∴ 「**防止堆积」**这个理由**不成立** ✓ ★
#   **∴ 用户的原话（**意思 ✓）✗**：**「**这个没必要 cancel**✗
#     ＋ **∴ 队列满了**你**人工把老的给 cancel 就好**」** ✓ ★
#       ＋ **∴ 所以 ✗**：**改成 `false`**✗ ⇒ **∴ 让**每个推送**都跑完** ✓
#         ＋ **∴ 而**人工取消**只在**真的堆积时**才做** ✓ ★
#   **∴ 与 release.yml 一致 ✗**：**那里本来就是 `cancel-in-progress: false`** ✓（**∴ 现在两者统一 ✓）★
# **★ 分两种引用（2026-10-15，用户指出"CI/CD 跑得有点重复"后改 ✓）★**
#   * **`main`** ✓ ⇒ **保持 `false`** ✓（保留文件头那条理由：`main` 上的每次推送都应当**跑完** ✓，
#     这样"某个提交的判据结果"永远是完整的 ✓，不会因为被后来的推送取代而消失 ✓）；
#   * **其它分支**（我的工作分支 `l4-sync` ✓）⇒ **`true`** ✓：一个分支上"最新的那次"才作数 ✓
#     ⇒ 旧的**已被取代** ✗ ⇒ 让它继续占 6 个分片的 runner 只是浪费 ✓
#     （2026-10-15 的实测账 ✓：最近 40 次里 `CI|push` 有 **28 次** ✓，多数互相比稿 ✗）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 钉住工具链版本：与本地一致，避免「本地 clippy 通过、CI clippy 报错」的版本漂移。
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 钉住工具链版本：与本地一致，避免「本地 clippy 通过、CI clippy 报错」的版本漂移。
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - name: Run tests
        # 不含 `--ignored`：长任务在 heavy.yml。
        run: cargo test --workspace

  # **★ `--features gpu` 的**构建与体积** ✗ ★**（第 290 轮 ✓；**目标第 10 条 ✓）：
  #   **∴ 为什么必须交给 CI ✗**：
  #     **∴ 本地实测**（**第 260–262 轮 ✓）**✗**：
  #       **∴ `--features gpu` ⇒ 编译面 **45 → 92** 个包** ✓（**+47 ✓）
  #       **∴ dev profile** **34.89 s** ✓（**∴ release** 会更久 ✓）
  #     ⇒ **∴ 而**本机**不适合**反复跑 release 全量** ✓（**∴ 目标第 10 条**明确交 CI ✓）** ✓✓
  #   **∴ 且**：**GitHub 的 runner **没有 GPU**** ✗
  #     ⇒ **∴ 三个 GPU 判据**会**自行跳过**（**∴ 它们**找不到适配器就 `return`** ✓）
  #       ⇒ **∴ 而**本 job 的价值在「**构建通过 ＋ 体积有数**」 ✓**** ✓✓
  #   **∴ 两面（**AGENTS.md 第 5 条 ✓）★**：
  #     **∴ 收益**：**每次 push 都能看到 `gpu` feature 的体积与编译时间** ✓
  #     **∴ 代价**：**CI 时间增加**（**∴ 首次约几十秒 ＋ 依赖缓存 ✓）** ✓✓
  gpu-feature:
    name: GPU feature (build and size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # **∴ 体积与时间都**记下来**✗ ⇒ **∴ 写进 job summary** ✓
      - name: Build with the gpu feature and report the size
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo build --release -p yanshi-http --bin yanshi-serve --features gpu
          end=$(date +%s)
          plain=$(stat -c %s target/release/yanshi-serve)
          {
            echo "## GPU feature build"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 构建时间 | $((end - start)) s |"
            echo "| 二进制 | $((plain / 1048576)) MiB ($plain B) |"
            echo "| 编译包数 | $(cargo tree -p yanshi-http -e normal --features gpu --prefix none | sed 's/ (.*//' | sort -u | wc -l) |"
            echo "| 默认编译包数 | $(cargo tree -p yanshi-http -e normal --prefix none | sed 's/ (.*//' | sort -u | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"
      # **★ 内核的 `--features gpu` 体积（**目标第 10 条 ✓）✗ ★**（**第 484 轮 ✓）
      #   **∴ 为什么 ✗**：**第 480 轮**给内核加了可选的 `gpu` feature**✗
      #     ⇒ **∴ 而**它的代价**是**依赖树从 67 包 ⇒ 198 包** ✓（**∴ 本机实测 ✓）
      #       ⇒ **∴ 于是**：**wasm 产物的体积**必须**在 CI 上量** ✓
      #         ＋ **∴ 判据** `tool-wasm-tree-no-wgpu.mjs` **守住** ≤ 6 MiB** ✓ ★**** ✓✓
      #   **∴ 注意（**如实 ✓）✗**：**本步**只**测出并写摘要**✗
      #     ⇒ **∴ 不设**硬门槛**✗（**∴ 因为**第 591 轮裁定**接受体积增长** ✓）
      #       ＋ **∴ 而**真正的门槛**在** `tool-wasm-tree-no-wgpu.mjs`** ✓ ★**** ✓✓
      - name: Add the wasm32 target for the kernel size probe
        run: rustup target add wasm32-unknown-unknown
      - name: Kernel size without and with the gpu feature
        run: |
          set -euo pipefail
          # **∴ ① 默认（**无 gpu ✓）**✗
          cargo build -p yanshi-wasm --release --target wasm32-unknown-unknown
          plain=$(stat -c %s target/wasm32-unknown-unknown/release/yanshi_wasm.wasm 2>/dev/null || echo 0)
          plain_pkgs=$(cargo tree -p yanshi-wasm -e normal --prefix none | sed 's/ (.*//' | sort -u | wc -l)
          # **∴ ② 带 gpu ✗**
          cargo build -p yanshi-wasm --release --features gpu --target wasm32-unknown-unknown
          gpu=$(stat -c %s target/wasm32-unknown-unknown/release/yanshi_wasm.wasm 2>/dev/null || echo 0)
          gpu_pkgs=$(cargo tree -p yanshi-wasm --features gpu -e normal --prefix none | sed 's/ (.*//' | sort -u | wc -l)
          {
            echo ""
            echo "## Kernel (wasm) size: default vs gpu"
            echo ""
            echo "| 配置 | .wasm 字节 | .wasm MiB | 编译包数 |"
            echo "|---|---|---|---|"
            echo "| 默认（**无 gpu ✓） | $plain | $((plain / 1048576)) | $plain_pkgs |"
            echo "| `--features gpu` | $gpu | $((gpu / 1048576)) | $gpu_pkgs |"
            echo ""
            echo "⇒ **∴ 上限判据 ✗**：\`scripts/tool-wasm-tree-no-wgpu.mjs\`（**≤ 6 MiB ✓）"
          } >> "$GITHUB_STEP_SUMMARY"
      # **∴ 让**默认产物的 pkg/ **可被判据读到**✗（**判据要那个文件 ✓）
      - name: Regenerate the default pkg for the size criterion
        run: |
          set -euo pipefail
          cargo build -p yanshi-wasm --release --target wasm32-unknown-unknown
          # **★ 版本来自 `Cargo.lock`，且**不许吞失败**✗ ★**（**第 492 轮 ✓）
          #   **∴ 原来 ✗**：`--version 0.2.104 --locked || true`**✗
          #     ⇒ **∴ 两处错**：**① 版本**过时**（**crate 是 0.2.129 ✓）
          #       ＋ **②** `|| true` **把失败吞掉** ✓
          #         ⇒ **∴ 于是**：**下一步 `wasm-bindgen`**会报 schema 版本不符** ✓
          VER="$(scripts/wasm-bindgen-version.sh)"
          echo "wasm-bindgen（Cargo.lock）= $VER"
          cargo install wasm-bindgen-cli --version "$VER" --locked
          wasm-bindgen --target web --out-dir crates/yanshi-wasm/pkg \
            target/wasm32-unknown-unknown/release/yanshi_wasm.wasm
      - name: Criterion - the kernel artifact stays under the limit
        run: node scripts/tool-wasm-tree-no-wgpu.mjs
      - name: Criterion - the kernel async gpu path is real
        run: node scripts/tool-kernel-gpu-async.mjs
      # **∴ `clippy` 也要在**这个配置**下过**✗（**∴ 它是**另一个编译配置** ✓）
      - name: Clippy with the gpu feature
        run: cargo clippy -p yanshi-http --features gpu --all-targets -- -D warnings
      # **∴ GPU 判据：**无适配器就**自行跳过**✗ ⇒ **∴ 不会**误红** ✓
      - name: GPU criteria (they skip when there is no adapter)
        run: |
          cargo test -p yanshi-http --features gpu --test gpu_f16_roundtrip
          cargo test -p yanshi-http --features gpu --test gpu_quantize_parity
          cargo test -p yanshi-http --features gpu --test gpu_chunked_quantize
          cargo test -p yanshi-http --features gpu --test gpu_scale_sweep
          cargo test -p yanshi-http --features gpu --test gpu_batch_submit
          # **★★★ `yanshi-render` 的 GPU 判据**也必须跑 ✗ ★★★**（**第 760 轮 ✓）
          #   **∴ 为什么 ✗**（**这是一条**真实的缺口**，不是预防性补丁 ✓）★**：
          #     **∴ 实测 ✗**：**`gpu_quantize_dispatch` 里那条**逐位一致**判据
          #       **已经失效很久** ✗：
          #       ＋ **∴ 它**假定阈值是 **30 000**✗ 而**现实是** 1 000 000** ✓
          #         ＋ **∴ 于是** 256×256 ＝ 65 536 **远低于阈值 ⇒ **∴ 断言**当场红** ✓
          #           ＋ **∴ 而**它**逃过了**本地门禁**✗（**`--quick` 跳过 `test (gpu)` ✓）
          #             ＋ **∴ 和** CI**✗（**这里原来**只跑 `yanshi-http` 的 5 个** ✓）★
          #               ＋ **∴ 所以**：**一次性失败**能藏几个月** ✓ ★★
          #   **∴ 修法 ✗**：**把**有 `gpu` feature 的 crate**都覆盖**✗
          #     ＋ **∴ 即**：**`yanshi-render`（**含量化／合成／哨兵 ✓）
          #       ＋ **∴ 与** `yanshi-http`（**上面那 5 个 ✓）★
          #   **∴ 代价（**两面都写 ✓）✗**：**这一步**多编译一个测试配置**✗
          #     ＋ **∴ 实测（**本机 i5-4250U ✓）✗**：** `cargo test -p yanshi-render --features gpu`
          #       **约 2 分钟**（**∴ CI **上更短 ✓）★
          #       ＋ **∴ 换取**：**GPU 量化／合成／哨兵的判据**不再能**静默失效** ✓ ★★
          cargo test -p yanshi-render --features gpu

  wasm-smoke:
    name: wasm smoke (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 钉住工具链版本：与本地一致，避免「本地 clippy 通过、CI clippy 报错」的版本漂移。
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Add the wasm32 target
        # 显式安装，不依赖 action 的隐式 target 处理：固定版本后曾出现
        # `can't find crate for std`（wasm32 的 std 未装）。
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Cache wasm-bindgen-cli
        # **缓存"不可并行的固定成本"** ✓：这一列判据分 6 片并行 ✓，但装工具**不该跟着复制 6 份** ✗
        #（从源码编要好几分钟 ✗）。缓存住了下一步的 `command -v` 就命中 ✓，没命中则照常 `cargo install` ✓（优雅降级 ✓）。
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}
      - name: Install wasm-bindgen-cli (pinned)
        # 版本必须与 `wasm-bindgen` crate 匹配，否则生成的胶水与 .wasm 不兼容。
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            # **∴ 版本来自 Cargo.lock（**不许写死 ✓）**
            VER="$(scripts/wasm-bindgen-version.sh)"
            cargo install wasm-bindgen-cli --version "$VER" --locked
          fi
      - name: Run wasm runtime smoke check
        # 这是唯一能抓住「原生全绿、浏览器/内核全崩」那类回归的检查
        # （曾有一个探针在 wasm32 上调用 Instant::now() 导致渲染必崩）。
        run: scripts/wasm-smoke.sh

  parity-arm64:
    # **跨平台结论必须有跨平台数据** ✓（第 805 轮）：此前**所有 job 都是 `ubuntu-latest`** ✗ ⇒
    # 「同一笔在两种渲染模式下逐字节相同」只在 **x86-64 native vs wasm32** 这一对上验过 ✓，
    # **aarch64 一行数据都没有** ✗ ⇒ 本 job 用 **arm64 runner** 只跑**这一条**判据 ✓（成本最小 ✓）。
    #
    # ⚠️ **它现在**不阻塞 CI****（`continue-on-error` ✓）—— 这是**有意的** ✓：
    #   微实验已证实**两边数学实现不同**（native=glibc ✓、wasm=Rust 自带 ✓ ⇒ 超越函数差 1 ulp ✗，
    #   而 `sqrt` 因为 IEEE 要求正确舍入 ⇒ 零差异 ✓）。传 `all` ⇒ **全量 199 支** ✓，
    #   **它会红，而"红"本身就是要收集的数据** ✓（差异有多大、哪些笔刷 ✓），
    #   不是"故障"✗ ⇒ 用与 `scripts/criteria-known-red.txt` **同一套机制**（照跑、照印、不阻塞 ✓）。
    # ⇒ **待内核换成两端同源实现后** ✓（第 801 轮记录的方案 ✓），把这一行删掉 ⇒ **改为阻塞** ✓。
    name: brush parity (arm64 vs wasm32, 50 sampled brushes)
    # **只在手动／定时时跑** ✓（第 42 轮实测为据 ✓）：
    #   它跑 `all`（199 支 × 4 色 ＝ 796 次 ✓），实测 **32m1s** ✗ —— 而每次推送都会**新起一个 run** ✓
    #   ⇒ `cancel-in-progress` 会在它跑完前把整个 run 取消 ✗ ⇒ **∴ 我连续多轮都拿不到"完成"的结论** ✗
    #   （看到的一直是 cancelled ✓，而**看不到**其它作业的最终结论 ✓）。
    # **∴ 它在 `push` 时不跑** ✓ —— 这样每次推送的 run 只需 ~9 分钟就能跑完 ✓ ⇒ **结论可见** ✓；
    #   而"跨平台数据"改由**手动／定时**取得 ✓（`heavy.yml` 已有 `workflow_dispatch` ✓，同一用途 ✓）。
    # ⚠️ **代价两面** ✗：收益＝每次推送的 run 能在 ~9 分钟内给出完整结论 ✓（**约束 4 才可验证** ✓）；
    #   代价＝跨平台比对**不再随每次推送自动跑** ✗ ⇒ 靠**定时／手动** ✓（它本来就 `continue-on-error` ✓、
    #   且是**已知红** ✓ ⇒ 随推送跑**不产生任何门禁价值** ✗，只拖长 run ✓）。
    if: github.event_name != 'push'
    # ★ 减工作量 ✗ ★（第 1000+ 轮 ✓）：实测 **42m12s** 被 `timeout` 杀 ✗（40 分钟不够 ✓），
    #   只推进到 `charcoal-blur1`（199 支的前 40-50 支）⇒ 全量要 **~3 小时** ✗
    #   **∴ 先试过 matrix 分 4 片 ✗ ⇒ **实测**runner 只有 **1 个并发**✗（4 片串行排队 ✓）
    #      ⇒ **∴ 分片**不省总时间**✗（**∴ 只让每片更短 ✓**）⇒ **∴ 撤掉 matrix ✓**
    #   **∴ 改成**均匀抽 50 支**✗**：50 × 4 色 ＝ 200 次 ⇒ **约 10 分钟** ✓
    #      （**∴ 脚本的 `brushes` 是位置参数 ✓ ⇒ 传名字即可 ✓，不用改脚本 ✓**）
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    # ⚠️ **job 级超时** ✗（第 818 轮 ✓）：这一条原本**没有**超时 ✓，而它跑的是
    # `node … all`（**没有 `timeout` 包住** ✗）⇒ 一旦卡住就**永远不结束** ✓
    # ⇒ **整个 run 永远不完成** ✓ ⇒ `gh` 在整轮完成前**拒绝给日志** ✗ ⇒
    # **我连别的 job 的失败都读不到** ✓（实测：卡了约 45 分钟 ✓）。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-parity
      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}-arm64
      - name: Install wasm-bindgen-cli (pinned)
        # 版本必须与 `wasm-bindgen` crate 匹配，否则生成的胶水与 .wasm 不兼容。
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            # **∴ 版本来自 Cargo.lock（**不许写死 ✓）**
            VER="$(scripts/wasm-bindgen-version.sh)"
            cargo install wasm-bindgen-cli --version "$VER" --locked
          fi
      - name: Build server and wasm package
        run: |
          cargo build --workspace
          cargo build -p yanshi-wasm --target wasm32-unknown-unknown --release
          cargo build --release --target wasm32-unknown-unknown \
            -p yanshi-medium-oil -p yanshi-medium-watercolor -p yanshi-medium-marker \
            -p yanshi-medium-pencil -p yanshi-medium-pixel -p yanshi-medium-example
          node scripts/mediums-sync.mjs
          wasm-bindgen --target web --out-dir crates/yanshi-wasm/pkg \
            target/wasm32-unknown-unknown/release/yanshi_wasm.wasm
      - name: Start a server and compare every brush
        # 起服务端的方式**照抄 `scripts/run-criteria.sh`** ✓（同一组 flag ✓ ⇒ 判据看到同样的环境 ✓）。
        run: |
          PORT=15100
          WORK="$(mktemp -d)"
          ./target/debug/yanshi-serve --bind "127.0.0.1:$PORT" --root "$WORK" \
            --doc boot --width 320 --height 240 --assets-dir "$PWD/assets" >"$WORK/server.log" 2>&1 &
          # **★ 必须收尾 ✗ ★**（2026-10-16 ✓）：上面那个服务是**长期服务** ⇒ 本步骤退出后若不杀它 ✗
          #   ⇒ 它变成**孤儿** ✓ ⇒ **∴ runner 实测会打出 `Terminate orphan process (pid …) (yanshi-serve)`** ✓✓
          #     ＋ **∴ 该 job 可能一直等 ⇒ 整轮 run 到不了终态** ✗（本 job 自己的注释里记过这个症状 ✓）。
          #   **∴ 用 `trap … EXIT` 收尾 ✓**（**∴ 与我在 10 余支判据里补的 `process.on("exit", …kill…)` 同理 ✓**）。
          SRV_PID=$!
          trap 'kill "$SRV_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do curl -sf "http://127.0.0.1:$PORT/api/documents" >/dev/null 2>&1 && break; sleep 0.5; done
          TOKEN="$(curl -s -X POST "http://127.0.0.1:$PORT/api/documents" -H 'content-type: application/json' \
            -d '{"doc_id":"boot","width":320,"height":240}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')"
          # 结论行会打出覆盖面与差异统计 ✓（runner 的成功/失败两种路径都会打最后一行 ✓）。
          # **命令也要有自己的上限** ✓（与 `run-criteria.sh` 同一做法 ✓）。
          # ★ 1800 秒（30 分钟）**不够** ✗ —— 实测这一轮跑了 **32m1s** ⇒ `timeout` 杀它 ⇒ **`exit code 124`** ✗
          #   （**∴ 124 是 GNU `timeout` 的退出码 ✓，不是 job 的 `timeout-minutes: 40` ✓**）。
          #   **∴ 现在给 2400 秒（40 分钟）✓**：实测 32m1s ＋ 一轮 CI 的负载波动 ⇒ 40 分钟有 8 分钟余量 ✓。
          # 均匀抽 50 支（步长 = 总数/50）✓ ⇒ 50 × 4 色 ＝ 200 次比较 ⇒ 约 10 分钟 ✓
          mapfile -t ALL < <(ls assets/brushes/*.myb | xargs -n1 basename | sed 's/\.myb$//' | sort)
          STEP=$(( (${#ALL[@]} + 49) / 50 ))
          LIST=()
          for ((i=0; i<${#ALL[@]}; i+=STEP)); do LIST+=("${ALL[i]}"); done
          echo "  抽样：${#LIST[@]} 支 / 共 ${#ALL[@]} 支（步长 $STEP）✓"
          timeout 900 node scripts/kernel-brush-parity.mjs "http://127.0.0.1:$PORT" boot "$TOKEN" \
            "$PWD/crates/yanshi-wasm/pkg/yanshi_wasm.js" "${LIST[@]}"

  criteria:
    # **并行分片** ✓：判据约 55 条，串行跑要十几分钟 ✗ ⇒ 拆 6 片并发 ✓（免费额度下这是纯赚 ✓）。
    # 每片各自构建 ✓（`Swatinem/rust-cache` 会命中缓存 ✓），因此**不依赖 build 产物传递** ✓（少一个失败点 ✓）。
    name: criteria shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: criteria
      - name: Cache wasm-bindgen-cli
        # **缓存"不可并行的固定成本"** ✓：这一列判据分 6 片并行 ✓，但装工具**不该跟着复制 6 份** ✗
        #（从源码编要好几分钟 ✗）。缓存住了下一步的 `command -v` 就命中 ✓，没命中则照常 `cargo install` ✓（优雅降级 ✓）。
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}
      - name: Install wasm-bindgen-cli (pinned)
        # **这一步历史上要几分钟** ✓（`cargo install` 从源码编 ✗）—— 加时间戳便于判断它是否卡住 ✓。
        run: |
          echo "::group::wasm-bindgen-cli install $(date -u +%T)"
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            # **∴ 版本来自 Cargo.lock（**不许写死 ✓）**
            VER="$(scripts/wasm-bindgen-version.sh)"
            cargo install wasm-bindgen-cli --version "$VER" --locked
          fi
      - name: Install chromium
        uses: browser-actions/setup-chrome@v1
      - name: Put a chromium name on PATH
        # 判据脚本按 `chromium` 找浏览器；这里把装好的 chrome 暴露成这个名字。
        run: sudo ln -sf "$(command -v chrome || command -v google-chrome)" /usr/local/bin/chromium
      - name: Add the wasm32 target
        # `rust-toolchain.toml` 会固定工具链 ⇒ 这里**显式**装目标（与 wasm-smoke job 同一做法 ✓，
        # 第一轮 CI 就是因为漏了这一步而报 `can't find crate for core` ✗）。
        run: rustup target add wasm32-unknown-unknown
      - name: Build server and wasm package
        run: |
          echo "::group::cargo build --workspace $(date -u +%T)"
          cargo build --workspace
          echo "::endgroup::"
          echo "::group::wasm build + bindgen $(date -u +%T)"
          cargo build -p yanshi-wasm --target wasm32-unknown-unknown --release
          cargo build --release --target wasm32-unknown-unknown \
            -p yanshi-medium-oil -p yanshi-medium-watercolor -p yanshi-medium-marker \
            -p yanshi-medium-pencil -p yanshi-medium-pixel -p yanshi-medium-example
          node scripts/mediums-sync.mjs
          wasm-bindgen --target web --out-dir crates/yanshi-wasm/pkg \
            target/wasm32-unknown-unknown/release/yanshi_wasm.wasm
      # **★ 把内核产物同步到 PWA 的静态目录 ✗ ★**（第 299 轮加 ✓；**修 CI 的两条意外失败 ✓）。
      #   **∴ 为什么必须有这一步 ✗**（**实测 ✓）**：
      #     **∴ `tool-pwa-assets.mjs` ✗**：**检查 `web/wasm/yanshi_wasm_bg.wasm`**✗
      #       ⇒ **∴ 而**上一步**只产出 `crates/yanshi-wasm/pkg/`** ✓
      #         ⇒ **★ 所以**（**`0ce0f53d` 那次 CI ✓）它**报
      #           「**❌ 内核 wasm 缺失：web/wasm/yanshi_wasm_bg.wasm**」** ✓ ★**** ✓✓
      #     **∴ `browser-offline-journal.mjs` ✗**：**它**要求** Service Worker **已激活****
      #       ⇒ **∴ 而** SW **要** wasm 资产**✗ ⇒ **∴ 同源** ✓**** ✓✓
      #   **∴ 实测统计（**`criteria shard 5/6` ✓）✗**：**通过 19｜★ 意外失败 2 ★｜已知红 3** ✓
      #   **∴ 两面（**AGENTS.md 第 3 条 ✓）★**：
      #     **∴ 收益**：**两条意外失败**应当消失**✗ ＋ **PWA 资产**在 CI 里**也有真实检查** ✓**** ✓✓
      #     **∴ 代价**：**每片多一次**文件拷贝**✗（**∴ 毫秒级 ✓）** ✓**** ✓✓
      - name: Sync the kernel into the PWA assets
        run: |
          # **★ 两步都要 ✗ ★**（第 322 轮 ✓；**修 `shard 5/6` 的两条意外失败 ✓）：
          #   **∴ ① `pwa-sync-wasm.mjs` ✗**：**把 `crates/yanshi-wasm/pkg/` ⇒ `web/wasm/`**
          #     ⇒ **∴ 第 299 轮**已加 ✓（**∴ 它**修掉了「**内核 wasm 缺失**」 ✓）** ✓✓
          #   **∴ ② `pwa-sync-viewer.mjs` ✗**：**拷贝 viewer 文件 ⇒ `web/`**
          #     （**`viewer-app.js`／`viewer.css`／`service-worker.js`／`api-local.js`／`store.js` ✓）
          #     ＋ **∴ 内联生成** `web/index.html`** ✓**** ✓✓
          #     **∴ 缺它的症状（**实测 ✓）**：**`tool-pwa-assets.mjs` 报
          #       「**❌ 没有任何 viewer 文件被副本化 ⇒ PWA 没有界面**」** ✓**** ✓✓
          #   **∴ 顺序 ✗**：**viewer 的脚本**要读 `web/wasm/*`**✗ ⇒ **∴ 所以**放它之后** ✓**** ✓✓
          #   **∴ 两面（**AGENTS.md 第 3 条 ✓）★**：
          #     **∴ 收益**：**`shard 5/6` 的两条**应当消失**✗ ＋ **PWA 资产**在 CI 里**也被真实检查** ✓**** ✓✓
          #     **∴ 代价**：**每片多一次**拷贝 ＋ **一次内联生成**✗（**∴ 毫秒–秒级 ✓）** ✓✓
          node scripts/pwa-sync-wasm.mjs
          node scripts/pwa-sync-viewer.mjs
      # **★ 逐条判据要的** release 二进制 ✗ ★**（第 301 轮加 ✓；**修 `shard 2/6` 的 ① ✓）。
      #   **∴ 根因（**实测 ✓）✗**：**`tool-render-cost-accounts.mjs` **默认**找
      #     `target/release/yanshi-serve`**✗（**它支持 `--baseline` 覆盖 ✓）
      #       ⇒ **∴ 而**本 job **只** `cargo build --workspace`（**debug ✓）** ✓
      #         ⇒ **★ 所以**它报「**--spawn 需要二进制：target/release/yanshi-serve**」** ✓ ★**** ✓✓
      #   **∴ 为什么不用 `--baseline target/debug/…` ✗ ★**：**那是一条**性能判据**
      #     ⇒ **∴ 用 debug 会**改变被测对象**✗（**优化等级不同 ✓）⇒ **∴ 性能数**不可信** ✓**** ✓✓
      #   **∴ 为什么只 build 一个包 ✗**：**`--release --workspace` 会让本 job **翻倍**
      #     ⇒ **∴ 而**只需要**那一个二进制**✗ ⇒ **∴ 所以**用 `-p yanshi-http --bin yanshi-serve` ✓**** ✓✓
      #   **∴ 两面（**AGENTS.md 第 3 条 ✓）★**：
      #     **∴ 收益**：**①** 转绿**✗ ＋ **性能判据**测的是**真 release** ✓**** ✓✓
      #     **∴ 代价**：**每片多一次** release 构建**✗
      #       ⇒ **∴ 而** rust-cache **命中后**只有增量**✗ ⇒ **∴ 实测**待 CI 报** ✓**** ✓✓
      - name: Build the release server for cost criteria
        run: cargo build --release -p yanshi-http --bin yanshi-serve
      - name: Run criteria
        # 已知红名单在 scripts/criteria-known-red.txt：仍会运行、结果照印，但不阻塞 CI。
        run: |
          echo "::endgroup::"
          echo "::group::criteria shard ${{ matrix.shard }}/6 $(date -u +%T)"
          SHARD=${{ matrix.shard }} SHARDS=6 scripts/run-criteria.sh
          echo "::endgroup::"
