# **★ 把 PWA 部署到 Cloudflare Workers ✓ ★**（第 611 轮 ✓；**部署矩阵 §7 ✓**）
#
# **∴ 为什么**不**放在 `ci.yml` 里 ✗**：**部署是**重活 ✗**（**构建 wasm ＋ 上传 ✓**），
#   而本仓库的约定是「**重活交给 CI 且**不阻塞每次 push**✗**」（**见 `ci.yml` 头部 ✓**）。
# **∴ 更重要的理由 ✗**：**每次 push 都部署 ⇒ **∴ 会把**未验证的版本**推给用户 ✗** ⇒
#   **∴ 所以只在这两种时机跑 ✓**：
#     **① 手动触发 ✓**（`workflow_dispatch` ✓ —— 想发就发 ✓）；
#     **② 打版本 tag 时 ✓**（`v*` ✓ —— 发版顺带部署 ✓）。
#
# **∴ 前置（**必须由仓库管理员配置 ✓**）**：
#   **`CLOUDFLARE_API_TOKEN`**（**Repository secret ✓**）＋ 可选的 **`CLOUDFLARE_ACCOUNT_ID`** ✓。
#   **⚠️ 未配置时** ✗**：**本工作流**不会失败**✗**，**而是**跳过部署并在
#   **Step Summary 里**如实写明"未部署 ＋ 原因"✗** —— **∴ 不许假装部署成功 ✓**。
name: PWA (Cloudflare Workers)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只校验产物、不真正部署（dry run）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 工具链（Rust + wasm32）
        run: |
          rustup target add wasm32-unknown-unknown
          cargo --version

      - name: 构建内核（wasm）
        run: cargo build -p yanshi-wasm --release --target wasm32-unknown-unknown

      - name: 安装 wasm-bindgen CLI
        run: |
          # **∴ 版本必须与 `Cargo.toml` 里的 `wasm-bindgen` 匹配 ✗**（**否则绑定不兼容 ✓**）。
          VER=$(grep -m1 '^wasm-bindgen' crates/yanshi-wasm/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "wasm-bindgen = $VER"
          cargo install wasm-bindgen-cli --version "$VER" --locked

      - name: 生成绑定（pkg/）
        run: |
          wasm-bindgen --target web --out-dir crates/yanshi-wasm/pkg \
            target/wasm32-unknown-unknown/release/yanshi_wasm.wasm


      - name: 同步 viewer ＋ 导出静态页（与服务端同一份）
        # **★ 必须在这里做 ✗ ★**（第 640 轮 ✓）：**∴ `web/index.html` 是**服务端生成的那一份**✗**
        #（**导出 ＋ 在 </body> 前注入本地接管片段 ✓**）⇒ **∴ 若跳过此步 ⇒ **∴ CI 构建的 PWA
        # 会用**过期的**页面 ✗**（**∴ 与"逐字节相同"判据不一致 ✓**）。
        # **∴ 它同时做三件事 ✗**：**① 同步 viewer 的 JS／CSS／SW ✓｜② 调 `--export-viewer-html` ✓**
        # **｜③ 注入 `web/pwa-inject.html` 并写出 `web/index.html` ✓**。
        # **★ 必须写成**一个**多行 `run` ✗ ★**（第 675 轮 ✓，**修一个真 bug ✓**）：
        #   **∴ 原写法是**两个 `run:` ✗** ⇒ **∴ YAML **只保留最后一个**✗**
        #   ⇒ **∴ 于是 `pwa-sync-viewer.mjs` **从未在 CI 里执行**✗**
        #   ⇒ **∴ CI 构建的 PWA 用的是**过期的 `web/index.html` ✗**
        #   （**∴ 讽刺的是**上面那段注释正写着"必须在这里做" ✓ —— **∴ 而 YAML 把它吃掉了 ✓**）。
        run: |
          node scripts/pwa-sync-viewer.mjs
          node scripts/pwa-sync-wasm.mjs

      - name: ★ 实测：wasm 体积（只测出 ＋ 写摘要；不设硬门槛）
        # 依据：目标第 10 条要求「体积／构建／wasm32 的实测交给 CI/CD」；
        # 而第 6 条已裁定「接受体积增长」⇒ 所以这里不设门槛，
        # 只测出并把数写进摘要 ⇒ 阶段二才有可比的前后数。
        # 没有基线的「接受增长」是空话。
        run: |
          echo "## wasm 体积（部署件）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 文件 | 字节 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in web/wasm/*.wasm; do
            [ -f "$f" ] || continue
            echo "| $f | $(wc -c < "$f") |" >> "$GITHUB_STEP_SUMMARY"
            echo "wasm 体积：$f = $(wc -c < "$f") 字节"
          done
          echo "（无门槛：第 6 条已裁定接受体积增长 ⇒ 这里只留基线数）" >> "$GITHUB_STEP_SUMMARY"

      - name: ★ 判据：PWA 资源完整性（失败即停）
        # **∴ 这条是**防撒谎判据 ✗**：**没有内核的 PWA 不许发布 ✓**（**`tool-pwa-assets.mjs` ✓**）。
        run: node scripts/tool-pwa-assets.mjs

      - name: ★ 判据：服务 worker 缓存戳**幂等**（**用户补丁换来的 ✓）
        # 守的 bug：`web/sw.js` 是 git 跟踪文件 ⇒ 占位符第一次运行后就被替换，
        # 此后只替换占位符的写法会静默无操作 ⇒ 戳永不更新 ⇒ 浏览器永远用旧缓存。
        run: node scripts/tool-sw-stamp-idempotent.mjs
      - name: ★ 判据：PWA 本地 API **行为级**（在 node 里真调用）
        # **∴ 它证明"三个端点真能用 ＋ 未实现端点真报 501"✗**（**不是查字符串 ✓**）
        # ⇒ **∴ 与上一条（**静态 ✓**）合起来 ⇒ **∴ 部署前有两层证据 ✓**。
        run: node scripts/tool-pwa-api-behaviour.mjs

      - name: 安装 chromium（供真实浏览器判据）
        # **∴ runner 上不保证有 chromium ✗** ⇒ **∴ 用官方安装器 ✓**（**零 npm 依赖到仓库里 ✓**）。
        # **⚠️ 本步骤**尚未在真实 runner 上跑过 ✗**（**本地已用系统 chromium 验过同一条判据 ✓**）。
        run: npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome"

      - name: ★ 判据：PWA **真实浏览器**（内核加载 ＋ /health 如实 ＋ 501 ＋ needs_render）
        # **∴ 与 node 行为判据互补 ✗**：**∴ 这条会**真的起 chromium ✗** ⇒ **∴ 它抓到过两个真缺陷 ✓**
        #（**`/health` 判定顺序 ✓；**数组 keyPath 让 IndexedDB 挂住 ✓**）。
        run: |
          BIN=$(find "$RUNNER_TEMP/chrome" -type f -name chrome | head -1)
          echo "CHROME_BIN=$BIN"
          CHROME_BIN="$BIN" node scripts/browser-pwa-local.mjs

      - name: ★ 判据集合：覆盖率守卫（**不许有判据被静默跳过**）
        run: node scripts/tool-criteria-coverage.mjs

      - name: 工作流结构判据（**无空 step ＋ 每步至多一个 run**）
        run: node scripts/tool-workflow-structure.mjs

      - name: 部署（或如实跳过）
        id: deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          if [ -z "${CF_TOKEN:-}" ]; then
            {
              echo "### ⚠️ 未部署：缺少仓库 secret \`CLOUDFLARE_API_TOKEN\`"
              echo ""
              echo "- 产物**已构建并通过判据** ✓（\`tool-pwa-assets.mjs\` 绿 ✓）"
              echo "- 要真正部署，请在仓库 Settings → Secrets 里配置该 token 后重跑本工作流"
              echo "- **本步骤**不会**谎报成功** ✗"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx --yes wrangler deploy --dry-run --outdir /tmp/pwa-dist
            echo "### ✅ dry run 通过（未真正部署）" >> "$GITHUB_STEP_SUMMARY"
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes wrangler deploy
          echo "### ✅ 已部署到 yanshi-online.wangda.today" >> "$GITHUB_STEP_SUMMARY"
          echo "skipped=0" >> "$GITHUB_OUTPUT"
