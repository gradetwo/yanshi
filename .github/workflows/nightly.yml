# **每夜构建** ✓ —— main 一推就编 nightly 二进制，别人直接下 nightly 就是 main 最新 ✓。
#
# **触发** ✓：push 到 main ＋ 手工 dispatch ✓。
#   文档-only 推送不编（**/*.md 不改二进制 ✓，与 ci.yml 的 paths-ignore 同口径 ✓）。
# **只编最新** ✓：concurrency 组 nightly、cancel-in-progress true ⇒
#   正在编时又推上来，取消前面的、只编最新的 ✓（用户要求 ✓）。
# **删后重建** ✓：`gh release edit` 不动 published_at，页面边栏日期永远停在首次创建日 ✓
#   （实测：Release 首次创建于 2026-10-30，11-04 的资产已是最新，边栏仍显示几天前 ✓）。
#   故 publish 改为先 delete（--cleanup-tag 连 tag 一并删）再 create ✓：边栏日期＝本次
#   创建日 ✓，tag 也随 create 落在本次 SHA，不再需要 tag PATCH ✓。代价 ✓：publish 中途
#   失败会留空缺（无 Release 或资产不全），下次 main 推送的 publish 重建完整一套 ✓；
#   publish 只在归档全验后、构建全绿时才跑 ✓。旧归档无需另行清理 ✓：delete 连同旧
#   归档一并删，新 Release 里只有本次归档＋SHA256SUMS ✓。
# **分支 dispatch 只编不发** ✓：publish 作业 gate 在 `github.ref == 'refs/heads/main'` ⇒
#   分支上 dispatch 只能验证构建路，绝不会把分支二进制发成 nightly ✓。
#   合入后的第一次证明，是合入后 main 上第一次 push 触发的 run 真正发了 nightly ✓。
# **构建路复用 release.yml** ✓：`make release` ⇒ `scripts/package-release.sh --out dist` ⇒
#   归档 ＋ SHA256SUMS ⇒ `scripts/release-verify-archive.sh` 校验 ⇒ 冒烟（/health）✓。
#   ＋ `scripts/package-installer.sh` ⇒ 每平台再出一份**安装包**（Windows `.msi`／
#   macOS `.dmg`／Linux `.deb`，名 `yanshi-<版本>-<target>.<ext>`），校验和追加进
#   同一份 SHA256SUMS；publish 的计数断言已同步改成「条目 == 归档数 + 安装包数」✓。
# **供应链** ✓：建 Release 用 runner 自带的 `gh`，不引入第三方 action（与 release.yml 同规则 ✓）；
#   产物搬运仍用 actions/download-artifact（release.yml 的 checksums 作业亦如此 ✓）。
# **只改 CI/CD 配置的提交**：run 只要能启动就可以停掉（见 release.yml 头部规则 ✓）——
#   但 nightly 的 dispatch 验证例外：它就是为了验证构建路，必须真跑完构建作业 ✓。

name: Nightly

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: prepare the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          ALL = [
              {"os": "ubuntu-latest", "label": "linux-x86_64", "target": "x86_64-unknown-linux-gnu"},
              # linux-arm64 用原生 ARM runner：冒烟要实跑包里的二进制，交叉编的包在 x86 runner 上跑不起来。
              {"os": "ubuntu-24.04-arm", "label": "linux-arm64", "target": "aarch64-unknown-linux-gnu"},
              {"os": "macos-15", "label": "macos-x86_64", "target": "x86_64-apple-darwin"},
              {"os": "macos-15", "label": "macos-arm64", "target": "aarch64-apple-darwin"},
              {"os": "windows-latest", "label": "windows-x86_64", "target": "x86_64-pc-windows-msvc"},
          ]
          print("matrix=" + json.dumps({"include": ALL}))
          PY

  package:
    name: package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install lld on macOS (the wasm kernel needs it)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install lld
          ls -la "$(brew --prefix lld)/bin" || true

      - name: Add the matrix target explicitly
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          rustup target list --installed | sort

      - uses: Swatinem/rust-cache@v2

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-bindgen-cli (pinned)
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            VER="$(scripts/wasm-bindgen-version.sh)"
            cargo install wasm-bindgen-cli --version "$VER" --locked
          fi
          wasm-bindgen --version

      - name: Build the nightly package
        run: |
          set -euo pipefail
          scripts/package-release.sh --target "${{ matrix.target }}" --out dist

      # **安装包工具链（只有 Windows 要装）**：WiX v3 走 choco（runner 自带 ✓）；
      # Linux 的 dpkg-deb、macOS 的 hdiutil/codesign 都是系统自带 ⇒ 不装任何东西 ✓。
      - name: Install the installer toolchain (Windows only)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          choco install wixtoolset -y --no-progress
          ls "/c/Program Files (x86)/WiX Toolset v3.14/bin" 2>/dev/null | head -5 || true

      # **安装包**：把刚打好的发行树再打成 .msi/.dmg/.deb（与 release.yml 同一条路、
      # 同一个脚本 ⇒ 两条线不会漂移）。目标与版本由脚本读归档里的 BUILD-INFO。
      - name: Build the platform installer
        run: |
          set -euo pipefail
          for a in dist/*.tar.gz; do
            scripts/package-installer.sh --archive "$a" --out dist
          done
          ls -la dist

      # **安装包自检**（与 release.yml 同款）：Linux 实装打 /health、macOS 挂载验
      # 结构与签名（同架构腿再冒烟）、Windows 行政安装验落地与 --version。
      - name: Verify the platform installer
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *-unknown-linux-*)
              deb=$(ls dist/*.deb | head -1)
              echo "-- DEB：$deb"
              dpkg-deb --info "$deb"
              dpkg-deb --contents "$deb" | grep -q 'usr/lib/yanshi/bin/yanshi-serve' || { echo "✗ .deb 里没有 usr/lib/yanshi/bin/yanshi-serve"; exit 1; }
              dpkg-deb --contents "$deb" | grep -q 'usr/bin/yanshi-serve' || { echo "✗ .deb 里没有 usr/bin/yanshi-serve"; exit 1; }
              dpkg-deb --contents "$deb" | grep -q 'usr/share/applications/today.wangda.yanshi.desktop' || { echo "✗ .deb 里没有 .desktop 文件"; exit 1; }
              dpkg-deb --contents "$deb" | grep -q 'usr/share/icons/hicolor/scalable/apps/today.wangda.yanshi.svg' || { echo "✗ .deb 里没有 hicolor scalable 图标"; exit 1; }
              dpkg-deb --contents "$deb" | grep -q 'usr/share/icons/hicolor/256x256/apps/today.wangda.yanshi.png' || { echo "✗ .deb 里没有 hicolor 256 PNG 图标"; exit 1; }
              sudo dpkg -i "$deb"
              work=$(mktemp -d); port=21988; log="$work/serve.log"
              yanshi-serve --bind "127.0.0.1:$port" --root "$work/root" --doc smoke --width 64 --height 64 >"$log" 2>&1 &
              pid=$!
              ok=no
              for _ in $(seq 1 40); do
                if curl -sf "http://127.0.0.1:$port/health" >/dev/null 2>&1; then ok=yes; break; fi
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.5
              done
              kill "$pid" 2>/dev/null || true
              sudo dpkg -r yanshi
              if [ "$ok" != yes ]; then
                echo "✗ 装好的 .deb 起服务后 /health 没响应 ⇒ 这个安装包不能发"
                tail -40 "$log" || true
                exit 1
              fi
              echo "✓ .deb 实装冒烟通过（dpkg -i → /health → dpkg -r）"
              ;;
            *-apple-darwin)
              dmg=$(ls dist/*.dmg | head -1)
              echo "-- DMG：$dmg"
              hdiutil verify "$dmg"
              mnt=$(mktemp -d)
              hdiutil attach "$dmg" -nobrowse -mountpoint "$mnt" >/dev/null
              test -d "$mnt/Yanshi.app" || { echo "✗ DMG 里没有 Yanshi.app"; hdiutil detach "$mnt" >/dev/null || true; exit 1; }
              codesign --verify --deep --strict "$mnt/Yanshi.app"
              echo "✓ DMG 结构与签名通过（Yanshi.app 在内、codesign 可验）"
              case "$(uname -m):${{ matrix.target }}" in
                arm64:aarch64-apple-darwin|x86_64:x86_64-apple-darwin)
                  work=$(mktemp -d); port=21988; log="$work/serve.log"
                  ( cd "$mnt/Yanshi.app/Contents/Resources/yanshi" && ./yanshi.sh --bind "127.0.0.1:$port" --root "$work/root" --doc smoke --width 64 --height 64 ) >"$log" 2>&1 &
                  pid=$!
                  ok=no
                  for _ in $(seq 1 40); do
                    if curl -sf "http://127.0.0.1:$port/health" >/dev/null 2>&1; then ok=yes; break; fi
                    kill -0 "$pid" 2>/dev/null || break
                    sleep 0.5
                  done
                  kill "$pid" 2>/dev/null || true
                  if [ "$ok" != yes ]; then
                    echo "✗ DMG 里的包起服务后 /health 没响应 ⇒ 这个安装包不能发"
                    tail -40 "$log" || true
                    hdiutil detach "$mnt" >/dev/null || true
                    exit 1
                  fi
                  echo "✓ DMG 内包冒烟通过（/health）"
                  ;;
                *)
                  echo "（交叉腿：runner 架构跑不了这个二进制 ⇒ 只验结构与签名，不冒烟）"
                  ;;
              esac
              hdiutil detach "$mnt" >/dev/null
              ;;
            *-pc-windows-msvc)
              msi=$(ls dist/*.msi | head -1)
              echo "-- MSI：$msi"
              admin=$(mktemp -d)
              MSYS_NO_PATHCONV=1 msiexec /a "$(cygpath -w "$PWD/$msi")" /qn TARGETDIR="$(cygpath -w "$admin")" || { echo "✗ msiexec /a 行政安装失败"; exit 1; }
              serve_exe=$(find "$admin" -name 'yanshi-serve.exe' | head -1)
              open_cmd=$(find "$admin" -name 'yanshi-open.cmd' | head -1)
              test -n "$serve_exe" || { echo "✗ 行政安装后找不到 yanshi-serve.exe"; find "$admin" | head -40; exit 1; }
              test -n "$open_cmd" || { echo "✗ 行政安装后找不到 yanshi-open.cmd（开始菜单快捷方式指向它）"; exit 1; }
              "$serve_exe" --version || { echo "✗ 装出来的 yanshi-serve.exe 跑不了 --version"; exit 1; }
              echo "✓ MSI 行政安装通过（文件落地、--version 可跑）"
              ;;
            *)
              echo "✗ 未知目标 ${{ matrix.target }} ⇒ 没有对应的安装包校验路"; exit 1
              ;;
          esac

      - name: Verify the package and its checksums
        run: |
          set -euo pipefail
          ls -la dist
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "✗ dist 里没有归档 ⇒ 打包没成功"; exit 1; }
          test -f dist/SHA256SUMS || { echo "✗ 没有 dist/SHA256SUMS ⇒ 校验和缺失"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c SHA256SUMS)
          else
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi
          for f in dist/*.tar.gz; do
            echo "-- 校验归档：$f"
            tar -tzf "$f" >/dev/null
          done

      - name: Smoke-test the package (start it and hit /health)
        run: |
          set -euo pipefail
          archive=$(ls dist/*.tar.gz | head -1)
          echo "-- 冒烟归档：$archive"
          work=$(mktemp -d)
          tar -xzf "$archive" -C "$work"
          root=$(find "$work" -maxdepth 1 -type d -name 'yanshi-*' | head -1)
          test -n "$root" || { echo "✗ 解包后找不到 yanshi-* 目录"; exit 1; }
          port=21987
          log="$work/serve.log"
          ( cd "$root" && ./yanshi.sh --bind "127.0.0.1:$port" --root "$work/root" \
              --doc smoke --width 64 --height 64 ) >"$log" 2>&1 &
          pid=$!
          ok=no
          for _ in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:$port/health" >/dev/null 2>&1; then ok=yes; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          if [ "$ok" != yes ]; then
            echo "✗ 包起来了但 /health 没响应 ⇒ 这个包不能发 ✗"
            echo "---- 服务日志（最后 40 行）----"
            tail -40 "$log" || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          echo "✓ 冒烟通过：包能起服务，/health 有响应 ✓"
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: yanshi-nightly-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.msi
            dist/*.dmg
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish the rolling nightly release
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yanshi-nightly-*
          path: artifacts

      - name: Merge checksums, self-check and update the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find artifacts -name SHA256SUMS -exec cat {} \; > merged.txt
          sort -k2 merged.txt | uniq > SHA256SUMS
          echo "== 合并后的校验和 =="
          cat SHA256SUMS
          n_entries=$(wc -l < SHA256SUMS)
          n_archives=$(find artifacts -name '*.tar.gz' | wc -l)
          n_installers=$(find artifacts \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) | wc -l)
          echo "条目 $n_entries ｜归档 $n_archives ｜安装包 $n_installers"
          if [ "$n_entries" -ne "$((n_archives + n_installers))" ]; then
            echo "✗ 校验和条目数与归档数＋安装包数不一致 ⇒ 不许发布（宁可红，不发无法校验的包 ✗）" >&2
            exit 1
          fi
          NOTES="Rolling nightly build from main.
          Installers: yanshi-<version>-<target>.msi (Windows) / .dmg (macOS) / .deb (Linux). The macOS app is ad-hoc signed and the MSI is unsigned; first launch needs a manual allow."
          # 删后重建（见文件头“删后重建”）：edit 不动 published_at，故先删再建；
          # create 会把 tag 建在本次 SHA，不再需要 tag PATCH。新 Release 里只有本次
          # 归档＋SHA256SUMS，旧归档随 delete 一并消失，无需另行清理。
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
          fi
          gh release create nightly --title "nightly" --notes "$NOTES" --target "${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY"
          shopt -s nullglob
          for f in $(find artifacts \( -name '*.tar.gz' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \) | sort); do
            gh release upload nightly "$f" --repo "$GITHUB_REPOSITORY"
          done
          gh release upload nightly SHA256SUMS --repo "$GITHUB_REPOSITORY"
          echo "== 滚动 nightly 已更新 ✓（commit ${GITHUB_SHA}，$n_archives 个平台归档＋$n_installers 个安装包）=="
