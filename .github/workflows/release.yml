# **发布打包** ✓ —— 两种触发：**打 tag** ✗ 与**手工**✗（用户要求 ✓）。
#
# **为什么不复用 `ci.yml`** ✗：CI 的目的是**验证 HEAD** ✓（`cancel-in-progress` ✓），
# 而发布的目的是**产出可下载的产物** ✗ ⇒ 两者混在一起会让"并发取消"误杀一次发布 ✓。
#
# **产物** ✓（接口取自真实脚本，不是猜的 ✓）：
#   `make release`      ⇒ `scripts/package-release.sh --out dist` ✓
#   `make release-all`  ⇒ `scripts/package-release.sh --all-targets --out dist` ✓
#   ⇒ 写出 `dist/<name>.tar.gz` ＋ `dist/SHA256SUMS` ✓
#   ⇒ 且每个归档都过 `scripts/release-verify-archive.sh` ✓（包名与包内二进制必须一致 ✓）。
#
# **供应链取舍** ✓：建 Release 用 runner **自带的 `gh`** ✓，**不引入第三方 action** ✗。
#   好处：少一个供应链面、少一次审计 ✓。代价：`gh` 的参数需要自己写对 ✓，
#   且没有第三方 action 那些现成的"上传多文件/自动生成说明"便利 ✓（这里用 shell 展开补上 ✓）。
# **★ 只改 CI/CD 配置的提交：run 只要能启动就可以停掉（用户指示 2026-10-15 ✓）★**
#
# **规则** ✓：提交**只动 `.github/**`**（workflow 配置 ✓）时，它触发的 run **只需证明"能跑起来"** ✓
# —— YAML 合法 ✓ ＋ GitHub 接受并**排队/启动**了这次 run ✓（配置不合法时 GitHub 会立刻判失败 ✓）
# ⇒ 之后**可以直接取消** ✓，不必等它跑完 ✗（那要占几十分钟 runner ✓，而**产品代码一行没变** ✓）。
#
# **什么时候绝不能停** ✗：
#   * **tag 发布**（`release.yml` 的 `push: tags` ✓）⇒ 它要**真的出包 ＋ 建 Release ＋ 传资产** ✓
#     ⇒ 停了就没有发布 ✓；
#   * **含产品代码的提交**（`crates/**`、`scripts/**`、`web/**` …）⇒ 那些 run 的结果才是"代码通过判据"的凭据 ✓；
#   * 想留档的那一次（例如 **tag 指向的那个提交** ✓）⇒ 它的 CI 结果是"发布出去的树通过判据"的证据 ✓。
#
# **本仓库的实测账** ✓（2026-10-15，用户指出"跑得有点重复"之后 ✓）：
#   最近 40 次运行里 `CI|push` 有 **28 次** ✓、`Release|workflow_dispatch` 有 **8 次**（**6 次被取消** ✗）
#   ⇒ 后者的平台构建被**起了 ~24 个、扔掉 ~18 个** ✗ ⇒ 所以这一条要写成规矩 ✓。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      # **★ 只跑哪些平台（2026-10-15 加 ✓）★**：留空 = **全部五个** ✓；
      #   写逗号/空格分隔的 label ⇒ **只起那几台 runner** ✓。
      #   **为什么加** ✗：需求文档的实现期我为了验证多平台，反复跑**整个四平台矩阵** ✓
      #   ⇒ 实测账：8 次手动触发里 **6 次被取消** ✗（＝起了 ~24 个平台构建、扔掉 ~18 个 ✗）
      #   ⇒ 想"只验 macOS"以前做不到 ✗（`targets` 输入只会让**四台**都去编同一个目标 ✗）。
      #   **用法** ✓：`platforms: macos-arm64` ⇒ 只起一台 ✓。
      platforms:
        description: "只跑哪些平台（逗号分隔；留空 = 全部）：linux-x86_64 / linux-arm64 / macos-x86_64 / macos-arm64 / windows-x86_64"
        required: false
        default: ""
      targets:
        description: "要打的目标平台；留空 = 当前平台；all = 逐个目标（没装的目标会跳过并说明）"
        required: false
        default: ""
      dynamic:
        description: "改成动态链接打包（仅在你确实需要时选）"
        type: boolean
        required: false
        default: false
      create_release:
        description: "手工触发时也创建 GitHub Release（tag 触发的默认行为）"
        type: boolean
        required: false
        default: false

# **★ 分清两种触发（2026-10-15，用户指出"CI/CD 跑得有点重复"后改 ✓）★**
#
# **tag 发布**（`push: tags` ✓）⇒ **绝不取消** ✓：一次发布被取消只是白白浪费已经编好的东西 ✗。
# **手动触发**（`workflow_dispatch` ✓）⇒ **可以取消** ✓：那个入口是拿来**验证**"多平台能不能编出包"的 ✓
#   ⇒ 我修一个问题就重跑一次 ✓ ⇒ 旧的那次**已经被取代了** ✗ ⇒ 让它继续占着 4 个平台的 runner
#   没有任何价值 ✗（2026-10-15 的实测账 ✓：8 次 dispatch 里 **6 次是我手动取消的** ✗
#   ⇒ 等于**起了 ~24 个平台构建、扔掉 ~18 个** ✗✓）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  # **★ 矩阵的唯一来源（2026-10-15 ✓）★**：以前 `package` 里写死一份 `include` ✓，
  #   现在改成这里**算一份 JSON** ✓ ⇒ 既支持"只跑某个平台" ✓，又**不会出现两份清单漂移** ✗。
  #   **用 python3** ✓（`ubuntu-latest` 自带 ✓，不必额外装东西 ✓）。
  #   **tag 推送时** ✓：`platforms` 输入为空 ⇒ **全部五个** ✓（发布永远是五平台 ✓）。
  prepare:
    name: prepare the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      picked: ${{ steps.m.outputs.picked }}
    steps:
      - id: m
        shell: bash
        env:
          WANT: ${{ github.event.inputs.platforms }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ALL = [
              {"os": "ubuntu-latest", "label": "linux-x86_64", "target": "x86_64-unknown-linux-gnu"},
              # linux-arm64 用原生 ARM runner：冒烟要实跑包里的二进制，交叉编的包在 x86 runner 上跑不起来。
              {"os": "ubuntu-24.04-arm", "label": "linux-arm64", "target": "aarch64-unknown-linux-gnu"},
              {"os": "macos-14", "label": "macos-x86_64", "target": "x86_64-apple-darwin"},
              {"os": "macos-14", "label": "macos-arm64", "target": "aarch64-apple-darwin"},
              {"os": "windows-latest", "label": "windows-x86_64", "target": "x86_64-pc-windows-msvc"},
          ]
          want = [w for w in os.environ.get("WANT", "").replace(",", " ").split() if w]
          picked = [e for e in ALL if not want or e["label"] in want]
          unknown = [w for w in want if w not in {e["label"] for e in ALL}]
          if unknown:
              print(f"::error::未知平台 {unknown} ⇒ 可选：{[e['label'] for e in ALL]}")
              raise SystemExit(1)
          if not picked:
              print("::error::过滤后一个平台都不剩 ⇒ 拒绝跑一个空矩阵")
              raise SystemExit(1)
          print("matrix=" + json.dumps({"include": picked}))
          print("picked=" + " ".join(e["label"] for e in picked))
          PY

  package:
    name: package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # **★ Windows 也要用 bash ★**（2026-10-15 加 ✓）：`package-release.sh` 是 bash 脚本 ✓，
    # 而 `windows-latest` 的缺省 shell 是 **pwsh** ✗ ⇒ 不声明就会被当成 PowerShell 而立刻失败 ✓。
    # Git Bash 在 runner 上**预装** ✓（`install`/`sha256sum`/`shasum` 都在 ✓）；
    # `objdump`/`ldd` 那套 **Linux 专属检查在非 Linux 上本来就会跳过** ✓（见脚本顶部说明 ✓）。
    defaults:
      run:
        shell: bash
    # **矩阵来自 `prepare`** ✓（唯一来源 ⇒ 不会漂移 ✗）
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          # **这里只装 wasm 内核要的那个** ✓ —— 矩阵目标**不在这里装** ✗：
          #   我原先把 `${{ matrix.target }}` 写进这个 `targets:` 多行块 ✓ ⇒ 实测**没装上** ✗
          #   （那一步"绿"了 ✓，而 Build 仍然报 `can't find crate for core` ＋
          #    "the x86_64-apple-darwin target may not be installed" ✗✗）
          #   ⇒ 改成下面**单独一步显式 `rustup target add`** ✓：不含糊 ✓，装不上就明着失败 ✓。
          targets: wasm32-unknown-unknown

      # **★ macOS 必须先装 Homebrew 的 `lld`（2026-10-15 CI 实测 ✓）★**
      #   现象 ✓：`error: linking with \`rust-lld\` failed: signal: 6 (SIGABRT)` ✗ ⇒
      #   `yanshi-medium-marker` / `yanshi-medium-oil` 都编不出来 ⇒ 打包 `tar: wasm-ld: Cannot stat` ✗。
      #   **根因** ✓：macOS 上 rustup 的 `rust-lld` 缺 `libLLVM.dylib` ✓（**脚本自己的提示里就写着** ✓，
      #   而 `docs/guide.md` 也记着这条 ✓）⇒ 装 Homebrew 的 **`lld`**（**单独的 formula** ✗，
      #   `brew install llvm` 里**没有**它 ✓）⇒ 脚本会自动改用它 ✓（`CARGO_TARGET_WASM32_…_LINKER` ✓）。
      #   **只在 macOS 上跑** ✓（Linux/Windows 的 runner 不需要 ✓）。
      - name: Install lld on macOS (the wasm kernel needs it)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install lld
          ls -la "$(brew --prefix lld)/bin" || true

      - name: Add the matrix target explicitly
        run: |
          set -euo pipefail
          # **★ 显式装矩阵目标（2026-10-15）★**：`macos-x86_64` 是**在 Apple Silicon 上交叉编** ✓
          # ⇒ 需要 `x86_64-apple-darwin` ✓；原生档上这条是空操作 ✓。
          # **为什么不信 action 的 `targets:`** ✗：写进去之后 Build 仍报
          #   `can't find crate for core` ＋ `the x86_64-apple-darwin target may not be installed` ✗
          # ⇒ 换成直接的 `rustup target add` ✓（它装不上会**非零退出** ✓，不会静默 ✓）。
          rustup target add "${{ matrix.target }}"
          rustup target list --installed | sort

      - uses: Swatinem/rust-cache@v2

      # **wasm 内核是构建产物** ✓ ⇒ 缺了只**警告**不失败 ✓（查看器回落服务端渲染 ✓），
      # 但发布包里应当尽量带上它 ✓ ⇒ 装一次 `wasm-bindgen-cli`（与 `ci.yml` 同一钉法 ✓）。
      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-${{ runner.os }}-${{ runner.arch }}

      - name: Install wasm-bindgen-cli (pinned)
        run: |
          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            # **∴ 版本来自 Cargo.lock（**不许写死 ✓）**
            VER="$(scripts/wasm-bindgen-version.sh)"
            cargo install wasm-bindgen-cli --version "$VER" --locked
          fi
          wasm-bindgen --version

      # **一条命令出包** ✓ —— 用 Makefile 里既有入口 ✓，不自己拼参数 ✗（拼错就和包装脚本漂移 ✓）。
      - name: Build the release package
        run: |
          set -euo pipefail
          # **矩阵里的目标**（多平台发布 ✓）；手工触发时 `targets` 输入**优先** ✓（便于临时指定 ✓）。
          MATRIX_TARGET="${{ matrix.target }}"
          TARGETS="${{ github.event.inputs.targets }}"
          DYNAMIC="${{ github.event.inputs.dynamic }}"
          FLAGS=""
          if [ "$DYNAMIC" = "true" ]; then FLAGS="--dynamic"; fi
          if [ -n "$TARGETS" ]; then
            if [ "$TARGETS" = "all" ]; then
              echo "== 逐个目标（手工指定 ✓）=="
              scripts/package-release.sh --all-targets $FLAGS --out dist
            else
              echo "== 指定目标（手工指定 ✓）：$TARGETS =="
              for t in $TARGETS; do
                scripts/package-release.sh --target "$t" $FLAGS --out dist
              done
            fi
          elif [ -n "$MATRIX_TARGET" ]; then
            echo "== 本平台目标（矩阵 ✓）：$MATRIX_TARGET =="
            scripts/package-release.sh --target "$MATRIX_TARGET" $FLAGS --out dist
          else
            echo "== 只打当前平台（未指定目标 ✓）=="
            scripts/package-release.sh $FLAGS --out dist
          fi

      # **自检** ✓：产物必须存在、校验和必须能验过 ✓ ⇒ 否则这一步就红，别把坏包发出去 ✗。
      - name: Verify the package and its checksums
        run: |
          set -euo pipefail
          ls -la dist
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "✗ dist 里没有归档 ⇒ 打包没成功"; exit 1; }
          test -f dist/SHA256SUMS || { echo "✗ 没有 dist/SHA256SUMS ⇒ 校验和缺失"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c SHA256SUMS)
          else
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi
          for f in dist/*.tar.gz; do
            echo "-- 校验归档：$f"
            tar -tzf "$f" >/dev/null
          done

      # **★ 冒烟：真的把包跑起来（2026-10-15 补上）★**
      #
      # **为什么必须有这一步** ✗（实测教训 ✓）：本工作流原先**只打包、不运行** ✗
      # ⇒ v0.2.0 的 Linux 静态包**起服务后立刻崩溃**（`SIGFPE` / `FPE_INTDIV`：静态链接的进程去
      # `dlopen` 系统图形栈，被加载库的 glibc 初始化在本进程是静态 glibc 时除以零 ✓）
      # 而 CI **照样绿** ✗✗ —— 坏包就这么发出去了 ✓。
      # 取证与控制变量实验见 `docs/design/release-packaging.md` ✓；当时的补救是另发了一个
      # 实测可用的 `-static-nogpu` 包 ✓。
      #
      # **这一步做什么** ✓：解包 → 用**包里的** `yanshi.sh` 起服务 → 轮询 `/health` → 杀掉 ✓；
      # **起不来就红** ✓，并把服务日志的最后若干行打出来（给人看的现场 ✓）。
      # **为什么用包里的 `yanshi.sh`** ✗：它会把资产路径指到包内 ✓（直接跑 `bin/yanshi-serve`
      # 会用相对的 `assets` ⇒ 在别的目录里取不到 ✓，那是**另一个**问题 ✗，不该混进这次冒烟 ✓）。
      - name: Smoke-test the package (start it and hit /health)
        run: |
          set -euo pipefail
          archive=$(ls dist/*.tar.gz | head -1)
          echo "-- 冒烟归档：$archive"
          work=$(mktemp -d)
          tar -xzf "$archive" -C "$work"
          root=$(find "$work" -maxdepth 1 -type d -name 'yanshi-*' | head -1)
          test -n "$root" || { echo "✗ 解包后找不到 yanshi-* 目录"; exit 1; }
          port=21987
          log="$work/serve.log"
          ( cd "$root" && ./yanshi.sh --bind "127.0.0.1:$port" --root "$work/root" \
              --doc smoke --width 64 --height 64 ) >"$log" 2>&1 &
          pid=$!
          ok=no
          for _ in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:$port/health" >/dev/null 2>&1; then ok=yes; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          if [ "$ok" != yes ]; then
            echo "✗ 包起来了但 /health 没响应 ⇒ 这个包不能发 ✗"
            echo "---- 服务日志（最后 40 行）----"
            tail -40 "$log" || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi
          echo "✓ 冒烟通过：包能起服务，/health 有响应 ✓"
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: yanshi-release-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      # **建 Release** ✓：tag 触发时总是建 ✓；手工触发时按输入决定 ✓。
      # 用 runner 自带的 `gh` ✓ ⇒ 不引入第三方 action ✓。
      - name: Create or update the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="manual-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "== Release tag: $TAG =="
          # 幂等：先试着建；已存在就只补传文件 ✓（手工重跑不该失败 ✗）。
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Automated release package. See dist/SHA256SUMS for checksums." --target "${GITHUB_SHA}"
          # 只传这个平台的文件 ✓ ⇒ 多平台 job 并行时各自补自己的那一份 ✓。
          shopt -s nullglob
          for f in dist/*.tar.gz dist/SHA256SUMS; do
            # 校验和文件跨平台同名 ⇒ 合并：先取下来再追加，避免互相覆盖 ✓。
            if [ "$(basename "$f")" = "SHA256SUMS" ]; then
              continue
            fi
            gh release upload "$TAG" "$f" --clobber
          done
          echo "== 已上传本平台的归档 ✓（校验和见各 artifact；如需汇总请用 artifact 下载 ✓）=="

      # **校验和的汇总挪到下面单独的 `checksums` 作业** ✓ —— 见那里的说明 ✓
      # （原来在这里只附 `linux-x86_64` 那一份 ✗ ⇒ 别的平台用户没法校验 ✗）。

  # **★ 汇总校验和：五个平台各一份 ⇒ 合成一份（2026-10-15 ✓）★**
  #
  # **为什么要它** ✗：原来只有 `linux-x86_64` 那一档会把 `dist/SHA256SUMS` 附到 Release 上 ✓
  # ⇒ 实测 v0.2.1 的 `SHA256SUMS` **只有一行**（126 字节 ⇒ 只有 Linux 包 ✓）
  # ⇒ **macOS 与 Windows 的包，用户拿不到校验和** ✗ —— 而"多平台发布"里那三档**正是这次新加的** ✓
  # ⇒ 新加的东西反而**没法校验** ✗ ⇒ 必须补 ✓。
  checksums:
    name: checksums (all platforms)
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yanshi-release-*
          path: artifacts

      - name: Merge, self-check and upload the checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # 每个 artifact 里都有一份**该平台自己算的** SHA256SUMS ✓ ⇒ 合并去重 ✓
          find artifacts -name SHA256SUMS -exec cat {} \; > merged.txt
          sort -k2 merged.txt | uniq > SHA256SUMS
          echo "== 合并后的校验和 =="
          cat SHA256SUMS
          # **自检** ✓：条目数必须等于**归档数** ✓（少一条 ⇒ 某个平台没把校验和带上来 ✗）
          n_entries=$(wc -l < SHA256SUMS)
          n_archives=$(find artifacts -name '*.tar.gz' | wc -l)
          echo "条目 $n_entries ｜归档 $n_archives"
          if [ "$n_entries" -ne "$n_archives" ]; then
            echo "✗ 校验和条目数与归档数不一致 ⇒ 不许发布（宁可红，不发无法校验的包 ✗）" >&2
            exit 1
          fi
          # **⇒ 必须显式给 `--repo`** ✗（v0.3.0 实测）：本作业**只下载产物、没 checkout** ✓
          #   ⇒ 而 `gh` 会去**当前目录**找 `.git` 推断仓库 ⇒
          #   `failed to run git: fatal: not a git repository` ✗ ⇒ 上传失败 ⇒ 整个发布红 ✓
          #   ⇒ 而自检那一步（条目 4 ｜归档 4）**是过的** ✓ ⇒ 所以失败**只在最后一条命令** ✓
          gh release upload "$TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          echo "== 全部 $n_entries 个平台的校验和已汇总上传 ✓ =="
